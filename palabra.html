<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181f" media="(prefers-color-scheme: dark)">
<title>Palabra de ánimo</title>
<style>
  :root {
    --fondo: #f6f1e7;
    --tarjeta: #fffdf8;
    --texto: #2a2620;
    --suave: #6f675a;
    --acento: #9a6b1f;
    --linea: #e4dccb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #14181f;
      --tarjeta: #1c222b;
      --texto: #ece6d9;
      --suave: #a39b8c;
      --acento: #e0b46a;
      --linea: #2c343f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--fondo);
    color: var(--texto);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    min-height: 100vh;
    min-height: 100dvh;
  }
  main {
    width: 100%;
    max-width: 520px;
    background: var(--tarjeta);
    border: 1px solid var(--linea);
    border-radius: 18px;
    padding: 32px 26px 28px;
  }
  .etiqueta {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--acento);
    margin: 0 0 20px;
  }
  blockquote {
    margin: 0;
    font-size: 25px;
    line-height: 1.45;
    text-wrap: pretty;
  }
  .referencia {
    margin: 18px 0 0;
    font-size: 17px;
    font-style: italic;
    color: var(--acento);
  }
  .separador {
    height: 1px;
    background: var(--linea);
    margin: 26px 0 22px;
  }
  .reflexion {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.6;
    color: var(--texto);
    text-wrap: pretty;
  }
  .pie {
    margin: 26px 0 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    color: var(--suave);
  }
  .volver {
    display: block;
    margin: 22px 0 0;
    padding: 12px;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--acento);
    border: 1px solid var(--linea);
    border-radius: 12px;
    text-decoration: none;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <p class="etiqueta">Palabra de ánimo</p>
  <blockquote id="texto"></blockquote>
  <p class="referencia" id="referencia"></p>
  <div class="separador" id="separador"></div>
  <p class="reflexion" id="reflexion"></p>
  <p class="pie">Léela despacio. Respira. No estás solo.</p>
  <a class="volver" href="./index.html">Volver a CaliFon</a>
</main>
<script>
  // La notificación trae el versículo en el enlace: ?t=texto&r=referencia&p=reflexión
  var q = new URLSearchParams(location.search);
  var texto = (q.get('t') || '').trim();
  var referencia = (q.get('r') || '').trim();
  var reflexion = (q.get('p') || '').trim();

  if (!texto) {
    texto = 'Venid a mí todos los que estáis trabajados y cargados, que yo os haré descansar.';
    referencia = 'Mateo 11:28';
    reflexion = 'No tienes que llegar fuerte ni con todo resuelto. La invitación es para el cansado, tal como está.';
  }

  document.getElementById('texto').textContent = '“' + texto + '”';
  document.getElementById('referencia').textContent = referencia ? '— ' + referencia : '';
  document.getElementById('reflexion').textContent = reflexion;
  if (!reflexion) {
    document.getElementById('separador').hidden = true;
    document.getElementById('reflexion').hidden = true;
  }
</script>
</body>
</html>
