<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRHH · La Roca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --stone-bg:#F3F1EA;
    --stone-card:#FFFFFF;
    --charcoal:#20242A;
    --charcoal-soft:#3A4048;
    --stone-line:#DEDACD;
    --gold:#B8912E;
    --gold-soft:#F3E7C8;
    --brick:#9A3F2E;
    --brick-soft:#F3DDD5;
    --green:#3F6B47;
    --green-soft:#DCEBDE;
    --slate:#6B6E63;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--stone-bg);color:var(--charcoal);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{min-height:100vh;}

  /* ---- LOGIN ---- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(circle at 20% 20%, #2b3038 0%, var(--charcoal) 55%, #171a1f 100%);}
  .login-card{background:var(--stone-card);border-radius:6px;padding:40px 36px;width:100%;max-width:380px;
    box-shadow:0 30px 60px rgba(0,0,0,.35);position:relative;}
  .login-card::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;border-radius:6px 6px 0 0;
    background:linear-gradient(90deg,var(--gold),#8a6a1f);}
  .login-brand{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;}
  .login-brand .mark{width:14px;height:14px;background:var(--gold);display:inline-block;transform:rotate(45deg);}
  .login-title{font-size:22px;font-weight:700;margin:0;}
  .login-sub{color:var(--slate);font-size:13px;margin:2px 0 28px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--charcoal-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  .field input{width:100%;padding:12px 14px;border:1.5px solid var(--stone-line);border-radius:4px;font-size:15px;font-family:'JetBrains Mono',monospace;background:#FAF9F5;}
  .field input:focus{outline:none;border-color:var(--gold);}
  .btn{width:100%;padding:13px;border:none;border-radius:4px;background:var(--charcoal);color:#fff;font-weight:600;font-size:14px;
    cursor:pointer;font-family:'Inter',sans-serif;transition:background .15s;}
  .btn:hover{background:#111418;}
  .btn.gold{background:var(--gold);color:#241c05;}
  .btn.gold:hover{background:#a17d27;}
  .btn.outline{background:transparent;border:1.5px solid var(--stone-line);color:var(--charcoal);}
  .btn.sm{width:auto;padding:8px 14px;font-size:13px;}
  .err{color:var(--brick);font-size:13px;margin-top:10px;min-height:16px;}

  /* ---- SHELL ---- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:230px;background:var(--charcoal);color:#EAE7DD;flex-shrink:0;display:flex;flex-direction:column;padding:22px 0;}
  .sidebar .brand{padding:0 22px 20px;border-bottom:1px solid #33383F;margin-bottom:14px;}
  .sidebar .brand .mark{width:12px;height:12px;background:var(--gold);display:inline-block;transform:rotate(45deg);margin-right:8px;}
  .sidebar .brand-name{font-family:'Space Grotesk';font-weight:700;font-size:17px;}
  .sidebar .who{padding:0 22px;font-size:12px;color:#9298A0;margin-bottom:6px;}
  .sidebar .who b{color:#fff;display:block;font-size:14px;margin-top:2px;}
  .navitem{padding:11px 22px;font-size:14px;cursor:pointer;color:#B7BCC3;border-left:3px solid transparent;font-weight:500;}
  .navitem:hover{color:#fff;background:#282D34;}
  .navitem.active{color:#fff;border-left-color:var(--gold);background:#282D34;}
  .sidebar-foot{margin-top:auto;padding:16px 22px 0;}

  .main{flex:1;padding:30px 36px;max-width:1180px;}
  .page-title{font-size:24px;font-weight:700;margin:0 0 4px;}
  .page-sub{color:var(--slate);font-size:14px;margin:0 0 24px;}

  .grid{display:grid;gap:16px;}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:900px){.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}

  .card{background:var(--stone-card);border:1px solid var(--stone-line);border-radius:6px;padding:20px;}
  .stat-card .label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);font-weight:600;}
  .stat-card .value{font-family:'JetBrains Mono';font-size:26px;font-weight:700;margin-top:8px;}
  .stat-card .value.gold{color:var(--gold);}

  .tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--stone-line);margin-bottom:20px;flex-wrap:wrap;}
  .tab{padding:10px 16px;font-size:14px;font-weight:600;color:var(--slate);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;}
  .tab.active{color:var(--charcoal);border-bottom-color:var(--gold);}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--slate);padding:8px 10px;border-bottom:1.5px solid var(--stone-line);}
  td{padding:10px 10px;border-bottom:1px solid var(--stone-line);}
  tr:last-child td{border-bottom:none;}

  .stamp{display:inline-block;font-family:'Space Grotesk';font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
    padding:4px 10px;border-radius:3px;border:1.5px solid; transform:rotate(-2deg);}
  .stamp.pendiente{color:var(--gold);border-color:var(--gold);background:var(--gold-soft);}
  .stamp.aprobado, .stamp.presente{color:var(--green);border-color:var(--green);background:var(--green-soft);}
  .stamp.rechazado, .stamp.ausente, .stamp.escrita{color:var(--brick);border-color:var(--brick);background:var(--brick-soft);}
  .stamp.verbal, .stamp.tarde{color:var(--charcoal-soft);border-color:var(--stone-line);background:#F1EFE7;}

  .empty{color:var(--slate);font-size:14px;padding:24px;text-align:center;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-row.x3{grid-template-columns:1fr 1fr 1fr;}
  select, textarea{width:100%;padding:11px 12px;border:1.5px solid var(--stone-line);border-radius:4px;font-size:14px;font-family:'Inter';background:#FAF9F5;}
  select:focus, textarea:focus{outline:none;border-color:var(--gold);}
  .modal-bg{position:fixed;inset:0;background:rgba(20,22,25,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:#fff;border-radius:6px;padding:26px;width:100%;max-width:480px;max-height:88vh;overflow:auto;}
  .modal h3{margin:0 0 18px;}
  .row-end{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .link{color:var(--charcoal-soft);font-size:13px;text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;}
  .btn-chat{color:var(--gold);font-size:13px;font-weight:600;cursor:pointer;background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:4px;padding:6px 12px;white-space:nowrap;}
  .btn-chat:hover{background:var(--gold);color:#fff;}
  .badge-role{font-size:11px;font-weight:700;text-transform:uppercase;background:var(--gold-soft);color:#7a5e1e;padding:3px 8px;border-radius:3px;margin-left:8px;}
  .nav-badge-roja{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:999px;background:#E53E3E;color:#fff;font-size:12px;font-weight:800;padding:0 6px;margin-left:8px;}
  .avatar{border-radius:50%;object-fit:cover;background:var(--gold-soft);}
  .avatar-ph{border-radius:50%;background:var(--charcoal-soft);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;flex-shrink:0;}
  .avatar-sm{width:36px;height:36px;font-size:14px;}
  .avatar-md{width:44px;height:44px;font-size:16px;}
  .avatar-lg{width:64px;height:64px;font-size:22px;}
  .avatar-wrap{position:relative;display:inline-block;cursor:pointer;}
  .avatar-wrap .cam{position:absolute;bottom:-2px;right:-2px;width:20px;height:20px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid #fff;}
  .who-head{display:flex;align-items:center;gap:10px;}
  .resumen-head{display:flex;align-items:center;gap:16px;margin-bottom:4px;}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--charcoal);color:#fff;padding:13px 18px;border-radius:5px;font-size:14px;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.3);}
  .search-input{padding:9px 12px;border:1.5px solid var(--stone-line);border-radius:4px;font-size:13px;width:220px;}
  ::placeholder{color:#A8A296;}
</style>
</head>

function saveSession(s){ state.session = s; sessionStorage.setItem('rrhh_session', JSON.stringify(s)); }

function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
function fmtL(n){ return 'L ' + Number(n||0).toLocaleString('es-HN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('es-HN',{day:'2-digit',month:'short',year:'numeric'}); }
function rangoFechasValido(inicio, fin){
  if(!inicio || !fin) return 'Completa fecha inicio y fin';
  const anioInicio = Number(inicio.slice(0,4)), anioFin = Number(fin.slice(0,4));
  if(anioInicio < 2000 || anioInicio > 2100 || anioFin < 2000 || anioFin > 2100) return 'Revisa el año de las fechas, se ve incorrecto';
  if(new Date(fin+'T00:00:00') < new Date(inicio+'T00:00:00')) return 'La fecha "hasta" no puede ser anterior a "desde"';
  return null;
}
function initials(nombre){ return (nombre||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function avatarHtml(nombre, fotoUrl, size){
  const cls = 'avatar-'+size;
  if(fotoUrl) return `<img class="avatar ${cls}" src="${fotoUrl}" alt="${nombre}">`;
  return `<div class="avatar-ph ${cls}">${initials(nombre)}</div>`;
}

async function uploadDoc(file){
  if(!file) return null;
  const path = `${Date.now()}_${file.name}`.replace(/\s+/g,'_');
  const {error} = await sb.storage.from('rrhh-documentos').upload(path, file);
  if(error){ toast('Error subiendo archivo: '+error.message); return null; }
  const {data} = sb.storage.from('rrhh-documentos').getPublicUrl(path);
  return data.publicUrl;
}

/* ============ LOGIN ============ */
async function doLogin(codigo, pin){
  const {data, error} = await sb.rpc('rrhh_login', {p_codigo: codigo, p_pin: pin});
  if(error){ return {error: 'Código o PIN incorrecto'}; }
  saveSession({...data, pin});
  return {ok:true};
}

function renderLogin(){
  const app = document.getElementById('app');
  app.innerHTML = `
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand"><span class="mark"></span><span class="login-title">La Roca · RRHH</span></div>
      <p class="login-sub">Portal de asociados · Corporación La Roca</p>
      <div class="field"><label>Código de asociado</label><input id="in-codigo" placeholder="ej. R1-014" autocomplete="off"></div>
      <div class="field"><label>PIN</label><input id="in-pin" type="password" placeholder="••••" autocomplete="off"></div>
      <button class="btn gold" id="btn-login">Entrar</button>
      <div class="err" id="login-err"></div>
    </div>
  </div>`;
  const doIt = async () => {
    const codigo = document.getElementById('in-codigo').value.trim();
    const pin = document.getElementById('in-pin').value.trim();
    const errEl = document.getElementById('login-err');
    if(!codigo || !pin){ errEl.textContent = 'Completa código y PIN.'; return; }
    errEl.textContent = 'Verificando...';
    const r = await doLogin(codigo, pin);
    if(r.error){ errEl.textContent = r.error; } else { errEl.textContent=''; render(); }
  };
  document.getElementById('btn-login').onclick = doIt;
  document.getElementById('in-pin').addEventListener('keydown', e=>{ if(e.key==='Enter') doIt(); });
}

/* ============ ADMIN DATA ============ */
async function loadAdminEmpleados(){

async function loadAdminDashboard(){
  const {session} = state;
  const {data, error} = await sb.rpc('rrhh_admin_dashboard', {p_admin_codigo: session.codigo, p_admin_pin: session.pin});
  if(error){ toast('Error: '+error.message); return; }
  state.adminData = data;
  loadChatUnread(data);
}
function chatSeenKey(tabla, id){ return 'rrhh_chat_seen_'+tabla+'_'+id; }
function marcarChatVisto(tabla, id, ultimoTs){
  if(!ultimoTs) return;
  localStorage.setItem(chatSeenKey(tabla, id), ultimoTs);
  state.chatUnread[tabla+'|'+id] = false;
}
async function loadChatUnread(d){
  const {session} = state;
  const items = [
    ...(d.vacaciones_pendientes||[]).map(x=>['vacaciones', x.id]),
    ...(d.permisos_pendientes||[]).map(x=>['permisos', x.id]),
    ...(d.adelantos_pendientes||[]).map(x=>['adelantos', x.id]),
    ...(d.prestamos_pendientes||[]).map(x=>['prestamos', x.id]),
  ];
  await Promise.all(items.map(async ([tabla, id]) => {
    const {data, error} = await sb.rpc('rrhh_admin_listar_mensajes_solicitud', {p_admin_codigo: session.codigo, p_admin_pin: session.pin, p_tabla: tabla, p_solicitud_id: id});
    if(error || !data || !data.length) return;
    const ultimo = data[data.length-1];
    const visto = localStorage.getItem(chatSeenKey(tabla, id));
    state.chatUnread[tabla+'|'+id] = !visto || visto < ultimo.created_at;
  }));
  if(state.view==='solicitudes'){ renderShell(viewSolicitudesAdmin()); bindSolicitudesAdmin(); }
}

function dashEmpFiltrados(){

      <div class="who-head" style="padding:0 22px 12px">
        ${avatarHtml(session.nombre, session.foto_url, 'md')}
        <div class="who" style="padding:0">Sesión activa<b>${session.nombre}${session.rol==='admin'?'<span class="badge-role">Admin</span>':''}</b></div>

      <div style="height:14px"></div>
      ${items.map(([k,label])=>{

        return `<div class="navitem ${state.view===k?'active':''}" data-nav="${k}">${label}${extra}</div>`;

    app.querySelectorAll('[data-resolve],[data-editar-empleado],[data-editar-accesos],[data-cambiar-pin],[data-nuevo],[btn-crear]').forEach(el=>el.remove());
  }
  if((state.session?.accesos_apps||{}).sin_cambio_pins===true){

  }
  if((state.session?.accesos_apps||{}).sin_autorizar===true){
    app.querySelectorAll('[data-resolve^="adelantos"]').forEach(el=>el.remove());
  }
  if((state.session?.accesos_apps||{}).solo_fichas===true){
    app.querySelectorAll('[data-resolve],[data-nuevo],[btn-crear],#btn-nuevo-empleado,#btn-guardar-asistencia,#btn-guardar-pago,#btn-guardar-incapacidad,#btn-guardar-llamada,#btn-guardar-memo,#btn-guardar-capacitacion,[data-hoja],[data-doc]').forEach(el=>el.remove());
  }
  app.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = () => { state.view = el.getAttribute('data-nav'); state.capAbierta=null; state.examen=null; state.examenRespuestas={}; render(); };
  });
  document.getElementById('btn-logout').onclick = logout;
}

function modalNuevaIncapacidad(){
  openModal(`
    <h3>Reportar incapacidad</h3>
    <div class="form-row">
      <div class="field"><label>Tipo</label><select id="mi-tipo"><option value="ihss">IHSS</option><option value="comun">Enfermedad común</option><option value="maternidad">Maternidad</option><option value="laboral">Riesgo laboral</option><option value="otro">Otro</option></select></div>
      <div></div>
    </div>
    <div class="form-row">
      <div class="field"><label>Desde</label><input type="date" id="mi-inicio"></div>
      <div class="field"><label>Hasta</label><input type="date" id="mi-fin"></div>
    </div>

    <div class="field"><label>Documento / constancia médica (opcional)</label><input type="file" id="mi-file" accept="image/*,.pdf"></div>
    <div class="row-end"><button class="link" id="mi-cancel">Cancelar</button><button class="btn gold sm" id="mi-save">Enviar</button></div>`);
  document.getElementById('mi-cancel').onclick = closeModal;
  document.getElementById('mi-save').onclick = async () => {
    const tipo = document.getElementById('mi-tipo').value;
    const inicio = document.getElementById('mi-inicio').value, fin = document.getElementById('mi-fin').value;
    const notas = document.getElementById('mi-notas').value.trim();
    const errFecha = rangoFechasValido(inicio, fin);
    if(errFecha){ toast(errFecha); return; }
    const file = document.getElementById('mi-file').files[0];
    const url = file ? await uploadDoc(file) : null;
    const {error} = await sb.rpc('rrhh_crear_incapacidad', {p_empleado_id: state.session.empleado_id, p_pin: state.session.pin, p_tipo: tipo, p_fecha_inicio: inicio, p_fecha_fin: fin, p_documento_url: url, p_notas: notas});
    if(error){ toast('Error: '+error.message); return; }
    notificarAdminsRRHH('🤒 Nueva incapacidad reportada', (state.session.nombre||'Un asociado')+' reportó incapacidad ('+tipo+') del '+fmtDate(inicio)+' al '+fmtDate(fin));
    closeModal(); toast('Incapacidad enviada — RRHH la va a revisar'); await loadExpediente(); render();
  };
}

function embedVideo(url){
  const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]+)/);
  if(yt) return `<iframe width="100%" height="360" style="border:none;border-radius:6px" src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen></iframe>`;
  const vm = url.match(/vimeo\.com\/(\d+)/);
  if(vm) return `<iframe width="100%" height="360" style="border:none;border-radius:6px" src="https://player.vimeo.com/video/${vm[1]}" allowfullscreen></iframe>`;
  return `<video id="training-video" width="100%" style="border-radius:6px;max-height:400px;background:#000" controls src="${url}"></video>`;
}

function bindDashboardEmpleados(){

function openModal(html){
  const bg = document.createElement('div'); bg.className='modal-bg'; bg.id='modal-bg';
  bg.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(bg);
  bg.addEventListener('click', e=>{ if(e.target===bg) closeModal(); });
}
let _chatPollTimer = null;
function closeModal(){
  document.getElementById('modal-bg')?.remove();
  if(_chatPollTimer){ clearInterval(_chatPollTimer); _chatPollTimer = null; }
}

const SOLICITUD_LABEL = {vacaciones:'Vacaciones', permisos:'Permiso', adelantos:'Adelanto', prestamos:'Préstamo'};

async function modalChatSolicitud(tabla, solicitudId, readonly){
  const esAdmin = state.session.rol === 'admin';
  openModal(`
    <h3>💬 ${SOLICITUD_LABEL[tabla]||''} — Comentarios</h3>
    <div id="chat-msgs" style="max-height:320px;overflow-y:auto;border:1px solid var(--stone-line);border-radius:4px;padding:10px;margin-bottom:12px;background:#FAF9F5">Cargando...</div>
    ${readonly
      ? `<p style="font-size:12px;color:var(--slate);margin:0 0 8px">🔒 Historial bloqueado — esta solicitud ya se resolvió, no se pueden agregar más comentarios.</p>`
      : `<div style="display:flex;gap:8px">
      <textarea id="chat-input" rows="2" placeholder="Escribe un mensaje..." style="flex:1"></textarea>
      <button class="btn gold sm" id="chat-send" style="align-self:flex-end">Enviar</button>
    </div>`}
    <div class="row-end"><button class="link" id="chat-close">Cerrar</button></div>`);
  document.getElementById('chat-close').onclick = closeModal;

  const pintarMsgs = (msgs) => {
    const box = document.getElementById('chat-msgs');
    if(!box) return;
    box.innerHTML = (msgs||[]).map(m=>`
      <div style="margin-bottom:10px;text-align:${m.autor_tipo==='admin'?'right':'left'}">
        <div style="display:inline-block;max-width:80%;padding:8px 12px;border-radius:8px;font-size:13px;
          background:${m.autor_tipo==='admin'?'var(--charcoal)':'#fff'};color:${m.autor_tipo==='admin'?'#fff':'var(--charcoal)'};border:1px solid var(--stone-line)">
          <div style="font-weight:700;font-size:11px;margin-bottom:2px;opacity:.8">${m.autor_nombre} · ${m.autor_tipo==='admin'?'RRHH':'asociado'}</div>
          ${m.mensaje}
        </div>
      </div>`).join('') || '<div class="empty" style="padding:8px">Sin comentarios todavía</div>';
    box.scrollTop = box.scrollHeight;
  };

  const cargar = async () => {
    const {data, error} = esAdmin
      ? await sb.rpc('rrhh_admin_listar_mensajes_solicitud', {p_admin_codigo: state.session.codigo, p_admin_pin: state.session.pin, p_tabla: tabla, p_solicitud_id: solicitudId})
      : await sb.rpc('rrhh_listar_mensajes_solicitud', {p_empleado_id: state.session.empleado_id, p_pin: state.session.pin, p_tabla: tabla, p_solicitud_id: solicitudId});
    if(error){ toast('Error: '+error.message); return; }
    pintarMsgs(data);
    if(esAdmin && data && data.length) marcarChatVisto(tabla, solicitudId, data[data.length-1].created_at);
  };
  await cargar();
  _chatPollTimer = setInterval(cargar, 5000);

  if(!readonly){
    document.getElementById('chat-send').onclick = async () => {
      const input = document.getElementById('chat-input');
      const mensaje = input.value.trim();
      if(!mensaje) return;
      const {error} = esAdmin
        ? await sb.rpc('rrhh_admin_enviar_mensaje_solicitud', {p_admin_codigo: state.session.codigo, p_admin_pin: state.session.pin, p_tabla: tabla, p_solicitud_id: solicitudId, p_mensaje: mensaje})
        : await sb.rpc('rrhh_enviar_mensaje_solicitud', {p_empleado_id: state.session.empleado_id, p_pin: state.session.pin, p_tabla: tabla, p_solicitud_id: solicitudId, p_mensaje: mensaje});
      if(error){ toast('Error: '+error.message); return; }
      const nombre = state.session.nombre || (esAdmin ? 'Un admin' : 'Un asociado');
      notificarAdminsRRHH(
        esAdmin ? `💬 ${nombre} comentó — ${SOLICITUD_LABEL[tabla]||''}` : `💬 Nuevo comentario — ${SOLICITUD_LABEL[tabla]||''}`,
        nombre+': '+mensaje.slice(0,150)
      );
      input.value = '';
      await cargar();
    };
  }
}

/* ---- Accesos por app (checkboxes reutilizables) ---- */
const APPS_SUITE = [['rrhh','RRHH'],['crm','CRM'],['cobranza','Cobranza'],['cierre','Análisis de Cierre'],['equipos','Equipos'],['arqueos','Arqueos'],['fintrack','Fintrack'],['erp','ERP']];
const SUCS_SUITE = [['R1','R1 Comercial'],['R2','R2 Barrio Arriba'],['R3','R3 Motors La Libertad'],['R4','R4 Su Mueble'],['R5','R5 Su Moto'],['R6','R6 (pruebas)']];
function accesosAppsBuilder(prefix, accesos){
  accesos = accesos || {};
  const sucs = Array.isArray(accesos.sucursales) ? accesos.sucursales : [];
  const rolArq = accesos.arqueos_rol || '';
  return `<label>Acceso a apps (Suite)</label>
    <div style="display:flex;flex-wrap:wrap;gap:14px;padding:10px 0 2px">
      ${APPS_SUITE.map(([k,label])=>`<label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;cursor:pointer">
        <input type="checkbox" id="${prefix}-${k}" ${accesos[k]?'checked':''}> ${label}</label>`).join('')}
    </div>
    <div style="margin-top:10px"><label style="display:block;font-size:12px;color:var(--slate)">Sucursales asignadas — filtran lo que ve en Cierre, Equipos y Arqueos</label>
      <div style="display:flex;flex-wrap:wrap;gap:12px;padding:6px 0 0">
        ${SUCS_SUITE.map(([v,l])=>`<label style="display:flex;align-items:center;gap:5px;font-size:13px;font-weight:500;cursor:pointer">
          <input type="checkbox" class="${prefix}-suc" value="${v}" ${sucs.includes(v)?'checked':''}> ${l}</label>`).join('')}
      </div></div>
    <div style="margin-top:10px"><label style="display:block;font-size:12px;color:var(--slate)">Rol en Arqueos</label>
      <select id="${prefix}-arqrol" class="input" style="width:100%">
        <option value="" ${!rolArq?'selected':''}>&mdash; Ninguno &mdash;</option>
        <option value="cajera" ${rolArq==='cajera'?'selected':''}>Cajera (solo sus sucursales)</option>
        <option value="auditor" ${rolArq==='auditor'?'selected':''}>Auditor (ve todas)</option>
      </select></div>`;
}
function leerAccesosAppsBuilder(prefix){
  const out = {};
  APPS_SUITE.forEach(([k])=>{ out[k] = !!document.getElementById(`${prefix}-${k}`)?.checked; });
  out.sucursales = [...document.querySelectorAll(`.${prefix}-suc:checked`)].map(c=>c.value);
  out.arqueos_rol = document.getElementById(`${prefix}-arqrol`)?.value || null;
  return out;
}

/* ============ RENDER ROUTER ============ */
async function render(){
  if(!state.session){ renderLogin(); return; }
  const {rol} = state.session;

  if(rol === 'admin'){
    if(state.view==='dashboard'){ if(!state.adminData) await loadAdminDashboard(); renderShell(viewDashboardAdmin()); }
    else if(state.view==='dashboard-empleados'){ if(!state.dashEmp) await loadDashEmpleados(); renderShell(viewDashboardEmpleados()); bindDashboardEmpleados(); }
    else if(state.view==='empleados'){ if(!state.empleados) await loadAdminEmpleados(); renderShell(viewEmpleadosAdmin()); bindEmpleadosAdmin(); }
    else if(state.view==='vacaciones-admin'){ await Promise.all([loadVacacionesAdmin(), loadPermisosAdmin()]); renderShell(viewVacacionesAdmin()); bindVacacionesAdmin(); }
    else if(state.view==='asistencias-admin'){ if(!state.empleados) await loadAdminEmpleados(); renderShell(viewAsistenciasAdmin()); bindAsistenciasAdmin(); }
    else if(state.view==='pagos-admin'){ if(!state.empleados) await loadAdminEmpleados(); if(!state.adminData) await loadAdminDashboard(); renderShell(viewPagosAdmin()); bindPagosAdmin(); }
    else if(state.view==='incapacidades-admin'){ if(!state.empleados) await loadAdminEmpleados(); renderShell(viewIncapacidadesAdmin()); bindIncapacidadesAdmin(); }
    else if(state.view==='llamadas-admin'){ if(!state.empleados) await loadAdminEmpleados(); renderShell(viewLlamadasAdmin()); bindLlamadasAdmin(); }
    else if(state.view==='memos-admin'){ if(!state.empleados) await loadAdminEmpleados(); if(!state.adminData) await loadAdminDashboard(); renderShell(viewMemosAdmin()); bindMemosAdmin(); }
    else if(state.view==='capacitaciones-admin'){ if(!state.capacitacionesAdmin) await loadCapacitacionesAdmin(); renderShell(viewCapacitacionesAdmin()); bindCapacitacionesAdmin(); }
    else if(state.view==='solicitudes'){ await loadAdminDashboard(); renderShell(viewSolicitudesAdmin()); bindSolicitudesAdmin(); }
    else { state.view='dashboard'; render(); }
    return;
  }

  if(!state.expediente) await loadExpediente();
  if(state.view==='resumen') renderShell(viewResumen());
  else if(state.view==='perfil'){ renderShell(viewPerfilEmpleado()); bindPerfilEmpleado(); }
  else if(state.view==='vacaciones'){ renderShell(viewVacaciones()); document.getElementById('btn-solicitar-vac').onclick = modalSolicitarVacacion; bindChatButtons();
    document.querySelectorAll('[data-hoja-emp]').forEach(btn=>{
      btn.onclick = () => {
        const e = state.expediente;
        const v = e.vacaciones.find(x=>x.id===btn.getAttribute('data-hoja-emp'));
        if(!v) return;
        modalHojaVacacion({ id:v.id, empleado:e.empleado.nombre, codigo:e.empleado.codigo, puesto:e.empleado.puesto, sucursal:e.empleado.sucursal,
          fecha_inicio:v.fecha_inicio, fecha_fin:v.fecha_fin, dias:v.dias_solicitados, motivo:v.motivo, aprobado_por:v.aprobado_por, documento_url:v.documento_url }, true);
      };
    });
  }
  else if(state.view==='permisos'){ renderShell(viewPermisos()); document.getElementById('btn-solicitar-permiso').onclick = modalSolicitarPermiso; bindChatButtons(); }
  else if(state.view==='adelantos'){ renderShell(viewAdelantosEmpleado()); document.getElementById('btn-solicitar-adelanto').onclick = modalSolicitarAdelanto; bindChatButtons();
    document.querySelectorAll('[data-comprobante-emp]').forEach(btn=>{
      btn.onclick = () => {
        const e = state.expediente;
        const a = e.adelantos.find(x=>x.id===btn.getAttribute('data-comprobante-emp'));
        if(!a) return;
        modalComprobanteAdelanto({ id:a.id, empleado:e.empleado.nombre, codigo:e.empleado.codigo, puesto:e.empleado.puesto, sucursal:e.empleado.sucursal,
          monto:a.monto, motivo:a.motivo, resuelto_por:a.resuelto_por, documento_url:a.documento_url }, true);
      };
    });
  }
  else if(state.view==='prestamos'){ renderShell(viewPrestamosEmpleado()); document.getElementById('btn-solicitar-prestamo').onclick = modalSolicitarPrestamo; bindChatButtons(); }
  else if(state.view==='asistencias') renderShell(viewAsistenciasEmpleado());
  else if(state.view==='pagos') renderShell(viewPagosEmpleado());
  else if(state.view==='incapacidades'){ renderShell(viewIncapacidadesEmpleado()); document.getElementById('btn-nueva-incapacidad').onclick = modalNuevaIncapacidad; }
  else if(state.view==='llamadas') renderShell(viewLlamadasEmpleado());
  else if(state.view==='memorandos'){ renderShell(viewMemorandosEmpleado()); bindMemorandosEmpleado(); }
  else if(state.view==='capacitaciones'){ if(!state.capacitaciones) await loadCapacitacionesEmpleado(); renderShell(viewCapacitacionesEmpleado()); bindCapacitacionesEmpleado(); }
  else { state.view='resumen'; render(); }
}

let perfilFotoPendiente = null;

function bindPerfilEmpleado(){
  perfilFotoPendiente = null;
  document.getElementById('btn-cambiar-foto').onclick = () => {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*';
    input.onchange = () => {
      const file = input.files[0];
      if(!file) return;
      perfilFotoPendiente = file;
      const wrap = document.getElementById('perfil-foto-wrap');
      const reader = new FileReader();
      reader.onload = () => { wrap.querySelector('.avatar, .avatar-ph').outerHTML = `<img class="avatar avatar-lg" src="${reader.result}">`; };
      reader.readAsDataURL(file);
      toast('Foto lista — recuerda tocar "Guardar cambios"');
    };
    input.click();
  };
  document.getElementById('btn-guardar-perfil').onclick = async () => {
    const nombre = document.getElementById('perfil-nombre').value.trim();
    const nacimiento = document.getElementById('perfil-nacimiento').value || null;
    const identidadFile = document.getElementById('perfil-identidad-file').files[0];
    let fotoUrl = null, identidadUrl = null;
    if(perfilFotoPendiente){ toast('Subiendo foto...'); fotoUrl = await uploadDoc(perfilFotoPendiente); }
    if(identidadFile){ toast('Subiendo identidad...'); identidadUrl = await uploadDoc(identidadFile); }
    const {error} = await sb.rpc('rrhh_actualizar_perfil', {
      p_empleado_id: state.session.empleado_id, p_pin: state.session.pin,
      p_nombre: nombre, p_foto_url: fotoUrl, p_identidad_url: identidadUrl, p_fecha_nacimiento: nacimiento });
    if(error){ toast('Error: '+error.message); return; }
    state.session.nombre = nombre || state.session.nombre;
    if(fotoUrl) state.session.foto_url = fotoUrl;
    saveSession(state.session);
    toast('Perfil actualizado');
    state.expediente = null; await loadExpediente(); render();
  };
}

function bindCapacitacionesEmpleado(){
  document.querySelectorAll('[data-open-curso]').forEach(el=>{
    el.onclick = () => { state.capAbierta = el.getAttribute('data-open-curso'); render(); };
  });
  const volver = document.getElementById('btn-volver-cap');
  if(volver) volver.onclick = () => { state.capAbierta=null; render(); };
  const volverDet = document.getElementById('btn-volver-detalle');
  if(volverDet) volverDet.onclick = () => { state.examen=null; state.examenRespuestas={}; render(); };
  const btnVisto = document.getElementById('btn-marcar-visto');
  if(btnVisto) btnVisto.onclick = async () => {
    const {error} = await sb.rpc('rrhh_marcar_video_visto', {p_empleado_id: state.session.empleado_id, p_pin: state.session.pin, p_capacitacion_id: state.capAbierta});
    if(error){ toast('Error: '+error.message); return; }
    toast('Video marcado como visto'); await loadCapacitacionesEmpleado(); render();
  };
  const btnExamen = document.getElementById('btn-tomar-examen');
  if(btnExamen) btnExamen.onclick = async () => {
    const {data, error} = await sb.rpc('rrhh_obtener_examen', {p_empleado_id: state.session.empleado_id, p_pin: state.session.pin, p_capacitacion_id: state.capAbierta});
    if(error){ toast('Error: '+error.message); return; }
    state.examen = data; state.examenRespuestas = {}; render();
  };
  const btnEnviar = document.getElementById('btn-enviar-examen');
  if(btnEnviar) btnEnviar.onclick = async () => {
    const respuestas = [];
    let completo = true;
    state.examen.forEach((q,i)=>{
      const sel = document.querySelector(`input[name="preg-${i}"]:checked`);
      if(!sel){ completo = false; return; }
      respuestas[i] = Number(sel.value);
    });
    if(!completo){ toast('Responde todas las preguntas'); return; }
    const {data, error} = await sb.rpc('rrhh_enviar_examen', {p_empleado_id: state.session.empleado_id, p_pin: state.session.pin, p_capacitacion_id: state.capAbierta, p_respuestas: respuestas});
    if(error){ toast('Error: '+error.message); return; }
    state.examen = null;
    toast(data.aprobado ? `¡Aprobado! ${data.puntaje}%` : `No alcanzaste el mínimo (${data.puntaje}%, necesitas ${data.minimo}%)`);
    await loadCapacitacionesEmpleado(); render();
  };
}

    if(!titulo){ toast('Escribe un título'); return; }
    if(state.nuevasPreguntas.length===0){ toast('Agrega al menos una pregunta'); return; }
    for(const q of state.nuevasPreguntas){
      if(!q.pregunta.trim() || q.opciones.some(o=>!o.trim())){ toast('Completa el texto de todas las preguntas y opciones'); return; }
    }
    if(file){ toast('Subiendo video...'); video = await uploadDoc(file); if(!video) return; }
    if(!video){ toast('Agrega una URL de video o sube un archivo'); return; }
    const {error} = await sb.rpc('rrhh_admin_crear_capacitacion', {
      p_admin_codigo: state.session.codigo, p_admin_pin: state.session.pin,
      p_titulo: titulo, p_descripcion: document.getElementById('cap-desc').value,
      p_video_url: video, p_duracion_min: Number(document.getElementById('cap-duracion').value||0) || null,
      p_preguntas: state.nuevasPreguntas, p_puntaje_minimo: Number(document.getElementById('cap-minimo').value||70)
    });
    if(error){ toast('Error: '+error.message); return; }
    toast('Capacitación publicada');
    state.nuevasPreguntas = []; state.capacitacionesAdmin = null;
    await loadCapacitacionesAdmin(); render();
  };
}

async function enviarValeArqueos(ad){
  try{
    const r = await fetch(ARQUEOS_URL+'/api/integra/vale', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-vale-key':VALE_KEY},
      body: JSON.stringify({
        codigo: ad.codigo, nombre: ad.empleado, sucursal: ad.sucursal,
        monto: ad.monto, motivo: ad.motivo,
        autorizado_por: state.session.nombre || 'RRHH', ref: ad.id
      })
    });
    const j = await r.json();
    if(!r.ok || !j.ok){ toast('⚠️ El adelanto quedó aprobado pero no se pudo generar en Arqueos'); return null; }
    const ga = 'GA-'+String(j.correlativo).padStart(6,'0');
    toast('✅ Vale '+ga+' generado en Arqueos — listo para pagar');
    try{
      const c = JSON.parse(localStorage.getItem('rrhh_vales_arq')||'{}');
      c[ad.id] = {correlativo:j.correlativo, url:j.pdf_url, fecha:new Date().toISOString()};
      localStorage.setItem('rrhh_vales_arq', JSON.stringify(c));
    }catch(e){}
    return {ga, url: j.pdf_url};
  }catch(e){ toast('⚠️ Arqueos no disponible; el adelanto quedó aprobado igual'); return null; }
}

function bindVacacionesAdmin(){
  document.querySelectorAll('[data-hoja]').forEach(btn=>{
    btn.onclick = () => {
      const vac = (state.vacacionesAdmin||[]).find(v=>v.id===btn.getAttribute('data-hoja'));
      if(vac) modalHojaVacacion(vac);
    };
  });
  bindChatButtons();
}
function bindSolicitudesAdmin(){
  bindChatButtons();
  document.querySelectorAll('[data-resolve]').forEach(btn=>{
    btn.onclick = async () => {
      const [tabla, id, estado] = btn.getAttribute('data-resolve').split('|');
      const vacRef = tabla==='vacaciones' ? (state.adminData.vacaciones_pendientes||[]).find(v=>v.id===id) : null;
      const adRef = tabla==='adelantos' ? (state.adminData.adelantos_pendientes||[]).find(a=>a.id===id) : null;
      const {error} = await sb.rpc('rrhh_admin_resolver_solicitud', { p_admin_codigo: state.session.codigo, p_admin_pin: state.session.pin, p_tabla: tabla, p_id: id, p_estado: estado });
      if(error){ toast('Error: '+error.message); return; }
      toast(estado==='aprobado' ? 'Solicitud aprobada' : 'Solicitud rechazada');
      if(tabla==='vacaciones') state.vacacionesAdmin = null;
      await loadAdminDashboard(); render();
      if(tabla==='vacaciones' && estado==='aprobado' && vacRef) modalHojaVacacion(vacRef);
      if(tabla==='adelantos' && estado==='aprobado' && adRef){ const vale=await enviarValeArqueos(adRef); modalComprobanteAdelanto({...adRef, vale_arq: vale}, false); }
    };
  });
}
