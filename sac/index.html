.ss-ban{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:#fdecec;border:1px solid #f3b4b0;color:#8f1d15;border-radius:10px;padding:10px 12px;margin-bottom:10px;cursor:pointer;font-size:13px}

.ss-n{display:flex;gap:6px;flex-wrap:wrap}.ss-n span{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:10px;background:#fff}.ss-n .c3{color:#fff;background:#b3261e}.ss-n .c2{color:#b3261e}.ss-n .c1{color:#8a5b00}

<div class="wrap">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ══ Config ══
var HUB_URL='https://upaenjotkocmdvfuobii.supabase.co'; // CRM/RRHH (tablas sac_*)
var HUB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwYWVuam90a29jbWR2ZnVvYmlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NjQzMzUsImV4cCI6MjA5NDQ0MDMzNX0.am0lcEwz4-HK0KvrPBtv1QB7joNYDpOuQNhbc1HjwZ8';
var COB_URL='https://ixskgawbpwwxdjnkiixt.supabase.co'; // Cobranza (clientes de cartera)
var COB_KEY='sb_publishable_-JUaSYPPkq8n4wJIKPtXGw_XMyj3EE7';
var sb=window.supabase.createClient(HUB_URL,HUB_KEY);
var sbCob=window.supabase.createClient(COB_URL,COB_KEY);
var BUCKET='sac-evidencias';

var SUCS={
  R1:{nombre:'La Roca Comercial #1',cartera:'LA_ROCA_COMERCIAL_1'},
  R2:{nombre:'La Roca Motors Barrio Arriba #1',cartera:'LA_ROCA_MOTORS_BARRIO_ARRIBA_1'},
  R3:{nombre:'La Roca Motors La Libertad #2',cartera:'LA_ROCA_MOTORS_LA_LIBERTAD_2'},
  R4:{nombre:'Su Mueble',cartera:'SU_MUEBLE'},
  R5:{nombre:'Su Moto Danlí',cartera:'SU_MOTO_DANLI'}
};
// Administrador de cada sucursal: recibe la alerta, sube la evidencia al proveedor y da seguimiento.
var ADMIN_SUC={R1:['v_ana'],R2:['v_ana'],R3:['v_gab'],R4:['v_kar','v_say'],R5:['v_kar','v_say']};
// Ven y gestionan todas las sucursales (Jorge, Isis) + quien tenga accesos_apps.sac_todo
var VER_TODO=['ADMIN','v_joh'];
// Semáforo (días desde que se reportó al proveedor)
var SLA_VERDE=3, SLA_AMARILLO=7;

var ESTADOS={
  ingresado:'Ingresado · por reportar',
  reportado:'Reportado al proveedor',
  visita_agendada:'Visita agendada',
  en_proceso:'En proceso',
  resuelto:'Resuelto · por confirmar',
  cerrado:'Cerrado',
  rechazado:'Rechazado'
};
var ABIERTOS=['ingresado','reportado','visita_agendada','en_proceso','resuelto'];
var TIPOS=['Falla / no funciona','Daño en entrega','Faltante de piezas','Garantía','Instalación','Otro'];
var SOLUCIONES=['Reparado','Cambio de producto','Repuesto entregado','Nota de crédito / devolución','Otro'];

// ══ Sesión (viene de CaliFon App) ══
var SES=null;
try{SES=JSON.parse(sessionStorage.getItem('suite_sesion')||'null');}catch(e){}
if(!SES||!SES.codigo){location.href='/';}
var ACC=(SES&&SES.accesos_apps)||{};
var YO={codigo:SES?SES.codigo:'',nombre:SES?SES.nombre:''};
var TODO=VER_TODO.indexOf(YO.codigo)>=0||ACC.sac_todo===true;
var MIS_ADMIN=Object.keys(ADMIN_SUC).filter(function(s){return ADMIN_SUC[s].indexOf(YO.codigo)>=0;});
var MIS_SUCS=TODO?Object.keys(SUCS):uniq((Array.isArray(ACC.sucursales)?ACC.sucursales:[]).concat(MIS_ADMIN)).filter(function(s){return SUCS[s];});
// Pantalla de administrador (reporta al proveedor por correo y da seguimiento) o de vendedor (ingresa y consulta)
var ADMINV=TODO||MIS_ADMIN.length>0;
function puedeGestionar(r){return TODO||MIS_ADMIN.indexOf(r.sucursal)>=0;}
function puedeVer(r){return TODO||MIS_SUCS.indexOf(r.sucursal)>=0||r.creado_por_codigo===YO.codigo;}

// ══ Estado ══
var FSS=false;
var RECS=[],EVS={},PROVS=[],PROV_MAIL={},MAILED={},TAB=ADMINV?'agenda':'nuevo',FIL={suc:'',estado:'abiertos',q:'',alertas:false};

// ══ Utilidades ══
function uniq(a){return a.filter(function(x,i){return a.indexOf(x)===i;});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function hoyISO(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
function addDiasISO(iso,n){var d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function fFecha(iso){if(!iso)return '—';var d=new Date(iso.length<=10?iso+'T12:00:00':iso);return d.toLocaleDateString('es-HN',{day:'2-digit',month:'short',year:'numeric'});}
function fFechaHora(iso){if(!iso)return '—';return new Date(iso).toLocaleString('es-HN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(function(){el.style.display='none';},2600);}
function diasAbierto(r){
  var ini=new Date(r.reportado_at||r.created_at);
  var rech=r.estado==='rechazado'?(EVS[r.id]||[]).filter(function(e){return e.tipo==='rechazado';}).pop():null;
  var fin=r.cerrado_at?new Date(r.cerrado_at):rech?new Date(rech.created_at):r.estado==='rechazado'?new Date(r.updated_at):new Date();
  return Math.max(0,Math.floor((fin-ini)/86400000));
}
function semaforo(r){
  if(r.estado==='cerrado'||r.estado==='rechazado')return 'n';
  var d=diasAbierto(r);return d<=SLA_VERDE?'g':d<=SLA_AMARILLO?'y':'r';
}
function fechaLocal(iso){var d=new Date(iso);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
function haceDias(iso){var n=Math.max(0,Math.floor((new Date()-new Date(iso))/86400000));return n<=0?'hoy':n===1?'ayer':'hace '+n+' días';}
function fechaReclamoISO(f){return f===hoyISO()?new Date().toISOString():new Date(f+'T12:00:00').toISOString();}
function demoPill(r){return r.demo?' <span class="pill demo" title="Reclamo de demostración (ficticio)">DEMO</span>':'';}
function telLimpio(t){var d=String(t||'').replace(/\D/g,'');if(d.length===8)d='504'+d;return d;}

// ══ Reclamos sin solución: alerta que sube de nivel con los días desde que se puso el reclamo ══
var ESC_N=[SLA_AMARILLO,15,30];
function sinSolucion(r){
  if(!r.reportado_at||['reportado','visita_agendada','en_proceso'].indexOf(r.estado)<0)return null;
  var d=diasAbierto(r);
  if(d>ESC_N[2])return {nivel:3,d:d,txt:'🚨 CRÍTICO: '+d+' días sin solución. Escalar con la gerencia del proveedor'};
  if(d>ESC_N[1])return {nivel:2,d:d,txt:'Sin solución hace '+d+' días: escalar con el supervisor del proveedor'};
  if(d>ESC_N[0])return {nivel:1,d:d,txt:'Sin solución hace '+d+' días: presionar al proveedor'};
  return null;
}
// ══ Alertas (lo que hay que hacer con cada reclamo) ══
function alertas(r){
  var a=[],hoy=hoyISO(),man=addDiasISO(hoy,1),evs=EVS[r.id]||[];
  if(ABIERTOS.indexOf(r.estado)<0)return a;
  var ultimo=evs.length?new Date(evs[evs.length-1].created_at):new Date(r.created_at);
  if(r.estado==='ingresado'){
    a.push({p:1,t:puedeGestionar(r)?'Reportar al proveedor: subir captura del chat o foto del correo':'Esperando que el administrador lo reporte al proveedor'});
  }
  if(r.estado==='reportado'){
    var desde=new Date(r.reportado_at||r.created_at);
    var fallida=evs.some(function(e){return e.tipo==='visita_fallida';});
    if(fallida)a.push({p:1,t:'Visita fallida: pedir nueva fecha al proveedor'});
    else if((new Date()-desde)/86400000>=2)a.push({p:2,t:'Sin fecha de visita: pedirla al proveedor'});
  }
  if(r.estado==='visita_agendada'&&r.fecha_visita){
    if(r.fecha_visita<hoy)a.push({p:1,t:'La visita fue el '+fFecha(r.fecha_visita)+': registrar resultado'});
    else if(r.fecha_visita===hoy||r.fecha_visita===man){
      var agendadaAt=null;evs.forEach(function(e){if(e.tipo==='visita_agendada')agendadaAt=e.created_at;});
      var confirmo=evs.some(function(e){return e.tipo==='llamada'&&e.datos&&e.datos.motivo==='Confirmar visita'&&e.resultado==='Contestó'&&(!agendadaAt||e.created_at>=agendadaAt);});
      if(!confirmo)a.push({p:1,t:'Visita '+(r.fecha_visita===hoy?'HOY':'mañana')+': llamar al cliente para que esté pendiente'});
    }
  }
  if(r.estado==='en_proceso'&&r.fecha_resolucion_est&&r.fecha_resolucion_est<hoy)a.push({p:2,t:'Proveedor atrasado: prometió resolver el '+fFecha(r.fecha_resolucion_est)});
  if(r.estado==='resuelto')a.push({p:2,t:'Llamar al cliente para confirmar y cerrar'});
  if((new Date()-ultimo)/3600000>=48&&r.estado!=='ingresado')a.push({p:3,t:'Sin actualización en 48 h'});
  var ss=sinSolucion(r);
  if(ss)a.push({p:ss.nivel===3?0:1,t:ss.txt});
  return a;
}

// ══ Carga ══
async function cargar(){
  var r1=await sb.from('sac_reclamos').select('*').order('created_at',{ascending:false});
  if(r1.error){document.getElementById('view').innerHTML='<div class="card err">Error cargando reclamos: '+esc(r1.error.message)+'</div>';return;}
  RECS=(r1.data||[]).filter(puedeVer);
  EVS={};
  var ids=RECS.map(function(r){return r.id;});
  if(ids.length){
    var r2=await sb.from('sac_eventos').select('*').in('reclamo_id',ids).order('created_at',{ascending:true});
    (r2.data||[]).forEach(function(e){(EVS[e.reclamo_id]=EVS[e.reclamo_id]||[]).push(e);});
  }
  if(!PROVS.length){
    var r3=await sb.from('ft_proveedores_catalogo').select('nombre,categoria,correo_reclamos').eq('activo',true).order('nombre');
    PROVS=(r3.data||[]).map(function(p){if(p.correo_reclamos)PROV_MAIL[p.nombre]=p.correo_reclamos;return p.nombre;});
  }
  render();
}

      +(r.fecha_visita&&r.estado==='visita_agendada'?' · 🗓️ visita '+fFecha(r.fecha_visita):'')+'</div>'

var FM={q:'',mios:false};
var PASOS=[['ingresado','Ingresado'],['reportado','Reportado'],['visita_agendada','Visita'],['en_proceso','En proceso'],['cerrado','Cerrado']];
function queSigue(r){
  var e=r.estado;
  if(e==='ingresado')return 'El administrador lo va a reportar al proveedor.';
  if(e==='reportado')return 'Reportado a '+r.proveedor+'. Esperando que den la fecha de visita.';
  if(e==='visita_agendada')return 'El técnico va el '+fFecha(r.fecha_visita)+(r.hora_visita?' ('+r.hora_visita+')':'')+'. El cliente debe estar pendiente del teléfono.';
  if(e==='en_proceso')return 'El proveedor lo está resolviendo'+(r.fecha_resolucion_est?' (prometió para el '+fFecha(r.fecha_resolucion_est)+')':'')+'.';
  if(e==='resuelto')return 'Resuelto. El administrador va a llamar al cliente para confirmar.';
  if(e==='cerrado')return 'Cerrado'+(r.solucion?': '+r.solucion:'')+'.';
  if(e==='rechazado')return 'El proveedor rechazó el reclamo. Consulta con el administrador.';
  return '';
}
function pasos(r){
  var idx={ingresado:0,reportado:1,visita_agendada:2,en_proceso:3,resuelto:3,cerrado:4,rechazado:1}[r.estado]||0;
  return '<div class="steps">'+PASOS.map(function(p,i){return '<div class="st'+(i<idx?' ok':i===idx?' on':'')+(r.estado==='rechazado'&&i===idx?' bad':'')+'"><span>'+(i<idx?'✓':i+1)+'</span>'+p[1]+'</div>';}).join('')+'</div>'
    +'<div class="sigue">👉 '+esc(queSigue(r))+'</div>';
}

async function comprimir(file){
  if(!file.type||file.type.indexOf('image/')!==0)return file;
  try{
    var bmp=await createImageBitmap(file);var max=1600,sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    var cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    var blob=await new Promise(function(res){cv.toBlob(res,'image/jpeg',0.82);});
    return blob?new File([blob],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):file;

function agregarFotos(inp){
  Array.prototype.forEach.call(inp.files,function(f){NV.fotos.push(f);});inp.value='';
  document.getElementById('n-thumbs').innerHTML=NV.fotos.map(function(f,i){return '<span title="Quitar" onclick="NV.fotos.splice('+i+',1);agregarFotos({files:[]})" style="cursor:pointer"><img src="'+URL.createObjectURL(f)+'"></span>';}).join('');

async function subirArchivos(files,carpeta){
  var out=[];
  for(var i=0;i<files.length;i++){
    var f=await comprimir(files[i]);
    var ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
    var path=carpeta+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.'+ext;
    var r=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type||undefined});
    if(r.error)throw new Error('No se pudo subir '+files[i].name+': '+r.error.message);
    out.push({url:sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl,nombre:files[i].name,tipo:f.type||''});
  }
  return out;
}
async function guardarNuevo(){
  var err=document.getElementById('n-err'),btn=document.getElementById('n-btn');
  var suc=document.getElementById('n-suc').value;
  var prov=document.getElementById('n-prov').value;if(prov==='__otro')prov=document.getElementById('n-prov-otro').value.trim();
  var tel=document.getElementById('n-tel').value.trim(),desc=document.getElementById('n-desc').value.trim();
  if(!suc)return err.textContent='Elige la sucursal.';
  if(!prov)return err.textContent='Elige el proveedor.';
  if(!NV.cli)return err.textContent='Elige el cliente de la lista (o la opción de cliente de contado).';
  if(telLimpio(tel).length<11)return err.textContent='Escribe un teléfono válido del cliente (8 dígitos).';
  if(!val('n-dir'))return err.textContent='Escribe la dirección para la visita del técnico.';
  if(!val('n-prod'))return err.textContent='Escribe el producto (marca y modelo).';
  if(!desc)return err.textContent='Describe lo que presenta el cliente.';
  if(!NV.fotos.length)return err.textContent='Agrega al menos una foto del reclamo.';
  err.textContent='';btn.disabled=true;btn.textContent='Subiendo fotos…';
  try{
    var fotos=await subirArchivos(NV.fotos,'reclamos/'+suc);
    btn.textContent='Guardando…';
    var row={estado:'ingresado',sucursal:suc,cartera_id:NV.cli.cobranza?SUCS[suc].cartera:null,cliente_nombre:NV.cli.nombre,
      telefono:tel,telefono2:document.getElementById('n-tel2').value.trim()||null,direccion:document.getElementById('n-dir').value.trim()||null,
      proveedor:prov,producto:document.getElementById('n-prod').value.trim()||null,serie:document.getElementById('n-serie').value.trim()||null,

async function trasAccion(id,msg){toast(msg);await cargar();abrir(id,DTAB);}
function val(i){var e=document.getElementById(i);return e?e.value.trim():'';}

function correoTexto(r){
  var suc=SUCS[r.sucursal]?SUCS[r.sucursal].nombre:r.sucursal;
  var asunto='Reclamo de garantía – '+r.cliente_nombre+' – '+(r.producto||'')+' – La Roca ('+suc+')';
  var L=['Buenos días, estimados de '+r.proveedor+':','','Por este medio les reportamos un reclamo de garantía de un cliente de Corporación La Roca, sucursal '+suc+'.','',
    'Cliente: '+r.cliente_nombre,'Teléfono: '+r.telefono+(r.telefono2?' / '+r.telefono2:''),'Dirección para la visita: '+(r.direccion||'—'),
    'Producto: '+(r.producto||'—'),'Serie / chasis / motor: '+(r.serie||'—'),'N° de factura: '+(r.factura||'—'),'Tipo de reclamo: '+(r.tipo||'—'),'Lo que presenta: '+r.descripcion,''];
  if(r.fotos&&r.fotos.length){L.push('Fotos del reclamo:');r.fotos.forEach(function(f){L.push(f.url);});L.push('');}
  L.push('Quedamos atentos al número de caso y a la fecha de visita del técnico. Por favor avisar al cliente antes de llegar.','','Saludos,',YO.nombre,'Corporación La Roca');
  return {asunto:asunto,cuerpo:L.join('\n')};
}
function correoDestino(){var m=val('a-mail');if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){document.getElementById('a-err').textContent='Escribe el correo de reclamos del proveedor.';return null;}document.getElementById('a-err').textContent='';return m;}
async function guardarCorreoProv(prov,m){if(PROV_MAIL[prov]===m)return;PROV_MAIL[prov]=m;try{await sb.from('ft_proveedores_catalogo').update({correo_reclamos:m}).eq('nombre',prov);}catch(e){}}
function enviarCorreo(id,modo){
  var r=RECS.find(function(x){return x.id===id;}),m=correoDestino();if(!m)return;
  var c=correoTexto(r);
  // Gmail no acepta adjuntos por enlace: se copia el cuerpo con las fotos y se pega con Ctrl+V en el correo
  if(modo==='gmail'&&(r.fotos||[]).length&&window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
    var html=c.cuerpo.split('\n').filter(function(l){return !/^https?:\/\//.test(l);}).map(function(l){return esc(l);}).join('<br>')
      .replace('Fotos del reclamo:','Fotos del reclamo:<br>'+r.fotos.map(function(f){return '<img src="'+esc(f.url)+'" width="480" style="max-width:100%;margin:4px 0"><br>';}).join(''));
    navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([c.cuerpo],{type:'text/plain'})})]).then(function(){
      toast('Correo con fotos copiado: pega con Ctrl+V en Gmail');
    },function(){toast('No se pudo copiar con fotos; usa Copiar texto');});
    window.open('https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(m)+'&su='+encodeURIComponent(c.asunto),'_blank');MAILED[id]=m;guardarCorreoProv(r.proveedor,m);
    document.getElementById('a-mailok').innerHTML='✅ Gmail abierto para <b>'+esc(m)+'</b>. Haz clic en el cuerpo del correo y pega con <b>Ctrl+V</b> (⌘+V en Mac): entra el texto con las fotos. Envíalo y luego sube la captura como evidencia.';
    return;
  }
  var url=modo==='gmail'?'https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(m)+'&su='+encodeURIComponent(c.asunto)+'&body='+encodeURIComponent(c.cuerpo)
    :'mailto:'+m+'?subject='+encodeURIComponent(c.asunto)+'&body='+encodeURIComponent(c.cuerpo);
  window.open(url,'_blank');MAILED[id]=m;guardarCorreoProv(r.proveedor,m);

}
// Fotos reales del reclamo como File (para adjuntarlas). Se precargan al abrir el reclamo para que compartir no pierda el gesto del usuario.
var FOTOS_F={};
function fotosArchivos(r){
  if(!FOTOS_F[r.id])FOTOS_F[r.id]=Promise.all((r.fotos||[]).map(function(f,i){
    return fetch(f.url).then(function(x){return x.blob();}).then(function(b){
      var ext=(b.type.split('/')[1]||'jpg').replace('jpeg','jpg');
      return new File([b],(r.ticket||'reclamo-'+r.id)+'-foto'+(i+1)+'.'+ext,{type:b.type||'image/jpeg'});
    });
  }));
  return FOTOS_F[r.id];
}
async function compartirConFotos(id){
  var r=RECS.find(function(x){return x.id===id;}),m=correoDestino();if(!m)return;
  var c=correoTexto(r);
  try{await navigator.clipboard.writeText(m);}catch(e){}
  try{
    var files=await fotosArchivos(r);
    if(!navigator.canShare({files:files})){toast('Este dispositivo no permite compartir fotos. Usa Descargar fotos.');return;}
    await navigator.share({files:files,title:c.asunto,text:c.cuerpo.replace(/\nFotos del reclamo:[\s\S]*?\n\n/,'\nFotos: adjuntas.\n\n')});
    MAILED[id]=m;guardarCorreoProv(r.proveedor,m);
    document.getElementById('a-mailok').innerHTML='✅ Fotos compartidas. Envía el correo a <b>'+esc(m)+'</b> y luego sube la captura como evidencia.';
  }catch(e){if(e&&e.name!=='AbortError')toast('No se pudo compartir: '+(e.message||e));}
}
async function descargarFotos(id){
  var r=RECS.find(function(x){return x.id===id;});
  try{
    var files=await fotosArchivos(r);
    files.forEach(function(f,i){setTimeout(function(){var a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();},i*300);});
    toast(files.length+' foto(s) descargada(s). Arrástralas al correo.');
  }catch(e){toast('No se pudieron descargar las fotos');}
}
function copiarCorreo(id){
  var r=RECS.find(function(x){return x.id===id;}),c=correoTexto(r),m=val('a-mail');

}

// ══ Indicadores (tiempos reales para estimar y evaluar proveedores) ══
var FD={per:'todo',suc:'',prov:''};
function prom(a){return a.length?Math.round(a.reduce(function(x,y){return x+y;},0)/a.length*10)/10:null;}
function difDias(a,b){return (new Date(b)-new Date(a))/86400000;}
function nf(v,suf){return v==null?'—':v+(suf||'');}
function pct(a,b){return b?Math.round(a/b*100)+'%':'—';}
function metricas(l){
  var m={n:l.length,ab:0,rojo:0,cer:0,sat:0,satN:0,rech:0,repH:[],aVis:[],aRes:[],aTiempo:0,resN:0,fall:0,vis:0};
  l.forEach(function(r){
    var evs=EVS[r.id]||[];
    if(ABIERTOS.indexOf(r.estado)>=0)m.ab++;
    if(semaforo(r)==='r')m.rojo++;
    if(r.estado==='cerrado')m.cer++;
    if(r.estado==='rechazado')m.rech++;
    if(r.satisfaccion){m.satN++;if(r.satisfaccion==='Satisfecho')m.sat++;}
    if(r.reportado_at)m.repH.push(Math.max(0,difDias(r.created_at,r.reportado_at)*24));
    var ag=evs.find(function(e){return e.tipo==='visita_agendada';});
    if(r.reportado_at&&ag&&ag.datos&&ag.datos.fecha)m.aVis.push(Math.max(0,difDias(r.reportado_at,ag.datos.fecha+'T12:00:00')));
    var fin=r.resuelto_at||r.cerrado_at;
    if(r.reportado_at&&fin){var d=Math.max(0,difDias(r.reportado_at,fin));m.aRes.push(d);m.resN++;if(d<=SLA_AMARILLO)m.aTiempo++;}
    evs.forEach(function(e){if(e.tipo==='visita_fallida'){m.fall++;m.vis++;}if(e.tipo==='visita_realizada')m.vis++;});
  });
  m.pRep=prom(m.repH);m.pVis=prom(m.aVis);m.pRes=prom(m.aRes);
  return m;
}
function horasTxt(h){return h==null?'—':h<24?Math.round(h)+' h':(Math.round(h/24*10)/10)+' días';}
function filtradosDatos(){
  var desde=null,hoy=hoyISO();
  if(FD.per==='mes')desde=hoy.slice(0,8)+'01';
  else if(FD.per==='30')desde=addDiasISO(hoy,-30);
  else if(FD.per==='90')desde=addDiasISO(hoy,-90);
  return RECS.filter(function(r){
    if(desde&&r.created_at.slice(0,10)<desde)return false;
    if(FD.suc&&r.sucursal!==FD.suc)return false;
    if(FD.prov&&r.proveedor!==FD.prov)return false;
    return true;
  });
}
function barra(v,max){var w=max&&v?Math.max(2,Math.round(v/max*100)):0;return '<div class="bar"><span style="width:'+w+'%"></span></div>';}
function renderDatos(){
  var provs=uniq(RECS.map(function(r){return r.proveedor;})).sort();
  var h='<div class="card"><div class="filters">'
    +'<select onchange="FD.per=this.value;renderDatos()">'+[['todo','Todo el historial'],['mes','Este mes'],['30','Últimos 30 días'],['90','Últimos 90 días']].map(function(o){return '<option value="'+o[0]+'"'+(FD.per===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>'
    +'<select onchange="FD.suc=this.value;renderDatos()"><option value="">Todas las sucursales</option>'+MIS_SUCS.map(function(s){return '<option value="'+s+'"'+(FD.suc===s?' selected':'')+'>'+esc(SUCS[s].nombre)+'</option>';}).join('')+'</select>'
    +'<select onchange="FD.prov=this.value;renderDatos()"><option value="">Todos los proveedores</option>'+provs.map(function(p){return '<option'+(FD.prov===p?' selected':'')+'>'+esc(p)+'</option>';}).join('')+'</select>'
    +'<button class="btn sec sm" onclick="descargarCSV()">⬇️ Descargar Excel</button>'
    +'</div>';
  var l=filtradosDatos(),m=metricas(l);
  if(!l.length){document.getElementById('view').innerHTML=h+'<div class="muted">No hay reclamos con este filtro.</div></div>';return;}
  var kpi=function(lab,v,sub,cls){return '<div class="kpi"><div class="l">'+lab+'</div><div class="v"'+(cls?' style="color:'+cls+'"':'')+'>'+v+'</div>'+(sub?'<div class="muted">'+sub+'</div>':'')+'</div>';};
  h+='<h2>Cómo vamos</h2><div class="kpis">'
    +kpi('Reclamos',m.n,m.ab+' abiertos · '+m.cer+' cerrados')
    +kpi('🔴 Sin solución +'+SLA_AMARILLO+' días',m.rojo,'abiertos que ya pasaron el límite',m.rojo?'#D93A3A':'')
    +kpi('Resueltos a tiempo',pct(m.aTiempo,m.resN),m.aTiempo+' de '+m.resN+' en '+SLA_AMARILLO+' días o menos')
    +kpi('Tiempo para reportar',horasTxt(m.pRep),'del ingreso al reporte al proveedor')
    +kpi('Días hasta la visita',nf(m.pVis),'del reporte a la visita del técnico')
    +kpi('Días para resolver',nf(m.pRes),'del reporte a la solución')
    +kpi('Visitas fallidas',pct(m.fall,m.vis),m.fall+' de '+m.vis+' visitas')
    +kpi('Rechazados',m.rech,'el proveedor no aceptó el reclamo')
    +kpi('Clientes satisfechos',pct(m.sat,m.satN),m.sat+' de '+m.satN+' encuestados al cerrar')
    +'</div>';
  // por mes
  var meses={};l.forEach(function(r){var k=r.created_at.slice(0,7);meses[k]=(meses[k]||0)+1;});
  var mk=Object.keys(meses).sort(),mmax=Math.max.apply(null,mk.map(function(k){return meses[k];}));
  var MES=['ene','feb','mar','abr','may','jun','jul','ago','sept','oct','nov','dic'];
  h+='<div class="grid2 dgrid"><div><h2>Reclamos ingresados por mes</h2><div class="cols">'+mk.map(function(k){
      return '<div class="col" title="'+MES[+k.slice(5)-1]+' '+k.slice(0,4)+': '+meses[k]+' reclamos"><b>'+meses[k]+'</b><span style="height:'+Math.max(4,Math.round(meses[k]/mmax*110))+'px"></span><small>'+MES[+k.slice(5)-1]+'</small></div>';}).join('')+'</div></div>';
  // por tipo
  var tipos={};l.forEach(function(r){var t=r.tipo||'Otro';tipos[t]=(tipos[t]||0)+1;});
  var tk=Object.keys(tipos).sort(function(a,b){return tipos[b]-tipos[a];}),tmax=tipos[tk[0]];
  h+='<div><h2>Tipo de reclamo</h2><table class="t"><tbody>'+tk.map(function(t){return '<tr title="'+esc(t)+': '+tipos[t]+'"><td>'+esc(t)+'</td><td style="width:45%">'+barra(tipos[t],tmax)+'</td><td style="text-align:right"><b>'+tipos[t]+'</b></td></tr>';}).join('')+'</tbody></table></div></div>';
  // por proveedor
  var gp={};l.forEach(function(r){(gp[r.proveedor]=gp[r.proveedor]||[]).push(r);});
  var filas=Object.keys(gp).map(function(k){return {k:k,m:metricas(gp[k])};});
  filas.sort(function(a,b){return (b.m.pRes==null?-1:b.m.pRes)-(a.m.pRes==null?-1:a.m.pRes)||b.m.n-a.m.n;});
  var rmax=Math.max.apply(null,filas.map(function(f){return f.m.pRes||0;}));
  h+='<h2 style="margin-top:16px">Proveedores</h2><div class="muted" style="margin-bottom:6px">Ordenados del más lento al más rápido en resolver. Sirve para exigirle a cada proveedor y para decirle al cliente cuánto se tarda.</div>'
    +'<div class="tscroll"><table class="t"><thead><tr><th>Proveedor</th><th>Reclamos</th><th>Abiertos</th><th>🔴</th><th>Días a visita</th><th style="min-width:170px">Días para resolver</th><th>Visitas fallidas</th><th>Rechazados</th><th>Satisfechos</th></tr></thead><tbody>'
    +filas.map(function(f){var x=f.m;
      return '<tr><td><b>'+esc(f.k)+'</b></td><td>'+x.n+'</td><td>'+x.ab+'</td><td>'+(x.rojo?'<b style="color:#D93A3A">'+x.rojo+'</b>':'0')+'</td><td>'+nf(x.pVis)+'</td>'
        +'<td><div class="row" style="flex-wrap:nowrap"><div style="flex:1">'+barra(x.pRes||0,rmax)+'</div><b style="min-width:30px;text-align:right">'+nf(x.pRes)+'</b></div></td>'
        +'<td>'+pct(x.fall,x.vis)+'</td><td>'+x.rech+'</td><td>'+pct(x.sat,x.satN)+'</td></tr>';}).join('')
    +'</tbody></table></div>';
  // por sucursal
  var gs={};l.forEach(function(r){(gs[r.sucursal]=gs[r.sucursal]||[]).push(r);});
  h+='<h2 style="margin-top:16px">Sucursales</h2><div class="muted" style="margin-bottom:6px">"Tiempo para reportar" mide qué tan rápido el administrador pasa el reclamo al proveedor.</div>'
    +'<div class="tscroll"><table class="t"><thead><tr><th>Sucursal</th><th>Reclamos</th><th>Abiertos</th><th>🔴</th><th>Tiempo para reportar</th><th>Días para resolver</th><th>Satisfechos</th></tr></thead><tbody>'
    +Object.keys(gs).sort().map(function(s){var x=metricas(gs[s]);
      return '<tr><td><b>'+esc(SUCS[s]?SUCS[s].nombre:s)+'</b></td><td>'+x.n+'</td><td>'+x.ab+'</td><td>'+(x.rojo?'<b style="color:#D93A3A">'+x.rojo+'</b>':'0')+'</td><td>'+horasTxt(x.pRep)+'</td><td>'+nf(x.pRes)+'</td><td>'+pct(x.sat,x.satN)+'</td></tr>';}).join('')
    +'</tbody></table></div>';
  // en rojo
  var rojos=l.filter(function(r){return semaforo(r)==='r';}).sort(function(a,b){return diasAbierto(b)-diasAbierto(a);});
  if(rojos.length){
    h+='<h2 style="margin-top:16px">🔴 Reclamos atrasados</h2>'+rojos.map(function(r){
      return '<div class="rec" onclick="abrir('+r.id+')"><div class="sem r"></div><div><div class="t">'+esc(r.cliente_nombre)+' <span class="pill '+r.estado+'">'+esc(ESTADOS[r.estado])+'</span>'+demoPill(r)+'</div><div class="s"><b>'+esc(r.ticket||'')+'</b> · '+esc(r.proveedor)+' · '+esc(r.producto||'')+'</div></div><div class="days">'+diasAbierto(r)+'<small>días</small></div></div>';}).join('');
  }
  h+='</div>';
  document.getElementById('view').innerHTML=h;
}
function descargarCSV(){
  var l=filtradosDatos();
  var cols=[['Ticket','ticket'],['Estado',function(r){return ESTADOS[r.estado]||r.estado;}],['Sucursal',function(r){return SUCS[r.sucursal]?SUCS[r.sucursal].nombre:r.sucursal;}],['Proveedor','proveedor'],['Caso proveedor','proveedor_caso'],
    ['Cliente','cliente_nombre'],['Teléfono','telefono'],['Producto','producto'],['Serie','serie'],['Tipo','tipo'],['Origen','origen'],['Presenta','descripcion'],
    ['Ingresado',function(r){return r.created_at.slice(0,10);}],['Fecha reclamo al proveedor',function(r){return r.reportado_at?fechaLocal(r.reportado_at):'';}],['Fecha visita','fecha_visita'],
    ['Resuelto',function(r){return (r.resuelto_at||'').slice(0,10);}],['Cerrado',function(r){return (r.cerrado_at||'').slice(0,10);}],
    ['Horas para reportar',function(r){return r.reportado_at?Math.round(difDias(r.created_at,r.reportado_at)*24):'';}],
    ['Días para resolver',function(r){var f=r.resuelto_at||r.cerrado_at;return r.reportado_at&&f?Math.round(difDias(r.reportado_at,f)*10)/10:'';}],
    ['Días abierto',function(r){return diasAbierto(r);}],['Solución','solucion'],['Satisfacción','satisfaccion'],['Ingresado por','creado_por'],['Demo',function(r){return r.demo?'sí':'';}]];
  var q=function(v){v=v==null?'':String(v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  var csv='﻿'+cols.map(function(c){return c[0];}).join(',')+'\n'+l.map(function(r){return cols.map(function(c){return q(typeof c[1]==='function'?c[1](r):r[c[1]]);}).join(',');}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='reclamos_sac_'+hoyISO()+'.csv';a.click();
}

// ══ Tutorial (se muestra la primera vez; se vuelve a abrir con "¿Cómo se usa?") ══
var TUTO_KEY='sac_tuto_v1_'+YO.codigo,TP=0;
function tutoPasos(){
  var admin=TODO||MIS_ADMIN.length>0;
  var p=[
    {i:'🛠️',t:'Bienvenido a Reclamos SAC',b:'Aquí se registra cada reclamo de un cliente sobre un producto (moto, electrodoméstico, mueble…) y se le da seguimiento con el proveedor hasta que quede resuelto.<br><br>Cada reclamo tiene un <b>ticket</b> (SAC-2026-0001) que se le manda al cliente.'},
    {i:'➕',t:'1. El vendedor ingresa el reclamo',b:'En la pestaña <b>Nuevo reclamo</b>:<ul><li>Elige la <b>sucursal</b> y el <b>proveedor</b>.</li><li>Busca al <b>cliente</b> por su nombre (sale de Cobranza). Si es de contado, lo escribe.</li><li>El <b>teléfono</b> es obligatorio: el técnico llama antes de llegar.</li><li>Describe lo que presenta y toma <b>fotos</b> del problema.</li></ul>Queda como <span class="pill ingresado">Ingresado · por reportar</span>.'},
    {i:'📧',t:'2. El administrador lo manda por correo',b:'Al administrador le aparece la alerta en el menú de CaliFon y en la Agenda.<ul><li>Abre el reclamo y presiona <b>Abrir en Gmail</b>: el correo ya va redactado con todos los datos y las fotos.</li><li>El correo de cada proveedor se guarda la primera vez.</li><li>Lo envía, sube la <b>evidencia</b> (captura del correo enviado) y se genera el <b>ticket</b> y sale el botón para mandárselo al cliente por WhatsApp.</li></ul>'},
    {i:'🗓️',t:'3. Visita del técnico',b:'Cuando el proveedor da la fecha, se anota en <b>Agendar visita</b>.<ul><li>Un día antes y el mismo día sale la alerta <b>"llamar al cliente para que esté pendiente"</b>.</li><li>Se registra la llamada. Si el cliente no contesta, el técnico no llega.</li><li>Después se anota si la visita se hizo. Si falló, el reclamo vuelve a pedir nueva fecha.</li></ul>'},
    {i:'✅',t:'4. Resolver y cerrar',b:'Si quedó pendiente (repuesto, cambio, taller) queda <span class="pill en_proceso">En proceso</span> con la fecha que prometió el proveedor.<br><br>Cuando se resuelve, se <b>llama al cliente</b> para confirmar que quedó bien y se <b>cierra</b> anotando si quedó satisfecho.'},
    {i:'📋',t:'La Agenda y el semáforo',b:'La <b>Agenda</b> empieza con <b>Por enviar al proveedor</b> (lo que todavía no tiene ticket) y abajo los <b>Tickets en seguimiento</b>, con lo urgente primero. El número de la derecha son los días desde que se reportó:<ul><li><span class="dot g"></span> hasta '+SLA_VERDE+' días</li><li><span class="dot y"></span> de '+(SLA_VERDE+1)+' a '+SLA_AMARILLO+' días</li><li><span class="dot r"></span> más de '+SLA_AMARILLO+' días: hay que presionar al proveedor</li></ul>Los reclamos <b>sin solución</b> salen arriba en rojo, y la alerta sube de nivel a los 7, 15 y 30 días (a los 30 es crítico: escalar con la gerencia del proveedor).<br><br>Cada reclamo se abre como documento, parecido a SAP: arriba los datos principales y abajo las pestañas <b>General, Actividades, Solución, Tarjeta de equipo, Historial y Adjuntos</b>. Si el equipo ya tuvo reclamos antes, sale un aviso.'},
    {i:'📊',t:'Indicadores',b:'Muestra cuánto tarda cada proveedor en visitar y resolver, cuántas visitas fallan, cuántos reclamos rechaza y qué tan satisfechos quedan los clientes. También muestra qué tan rápido reporta cada sucursal.<br><br>Con eso se le exige al proveedor y se le puede decir al cliente cuánto se tarda. Se puede <b>descargar en Excel</b>.'}
  ];
  if(!admin){p.splice(2,5,
    {i:'📧',t:'2. Qué pasa después',b:'El administrador de tu sucursal le manda el reclamo por correo al proveedor y se genera el <b>ticket</b>. Luego se agenda la visita del técnico y se cierra cuando quede resuelto.<br><br>Por eso es importante llenar <b>todo</b>: teléfono, dirección, producto, serie, factura y fotos claras.'},
    {i:'📋',t:'3. Mis reclamos',b:'En <b>Mis reclamos</b> ves en qué paso va cada reclamo de tu sucursal:<div class="steps" style="margin:12px 0"><div class="st ok"><span>✓</span>Ingresado</div><div class="st ok"><span>✓</span>Reportado</div><div class="st on"><span>3</span>Visita</div><div class="st"><span>4</span>En proceso</div><div class="st"><span>5</span>Cerrado</div></div>Si el cliente pregunta, ahí está el ticket, la fecha de visita y lo que sigue. Si el cliente te llama con algo nuevo, agrégalo y le llega al administrador.'});}
  return p;
}
function tutoAbrir(){TP=0;tutoPintar();}
function tutoPintar(){
  var p=tutoPasos(),s=p[TP];
  var h='<div class="ov" id="tuto" onclick="if(event.target.id===\'tuto\')tutoCerrar()"><div class="modal tuto">'
    +'<div class="tuto-i">'+s.i+'</div><h2>'+s.t+'</h2><div class="tuto-b">'+s.b+'</div>'
    +'<div class="tuto-dots">'+p.map(function(_,i){return '<span class="'+(i===TP?'on':'')+'" onclick="TP='+i+';tutoPintar()"></span>';}).join('')+'</div>'
    +'<div class="row" style="justify-content:space-between;margin-top:14px"><button class="btn sec sm" onclick="tutoCerrar()">Saltar</button><div class="row">'
    +(TP?'<button class="btn sec sm" onclick="TP--;tutoPintar()">← Atrás</button>':'')
    +(TP<p.length-1?'<button class="btn sm" onclick="TP++;tutoPintar()">Siguiente →</button>':'<button class="btn ok sm" onclick="tutoCerrar()">¡Listo, empezar!</button>')
    +'</div></div></div></div>';
  var o=document.getElementById('tuto');if(o)o.remove();document.body.insertAdjacentHTML('beforeend',h);
}
function tutoCerrar(){var o=document.getElementById('tuto');if(o)o.remove();try{localStorage.setItem(TUTO_KEY,'1');}catch(e){}}
function tutoPrimeraVez(){var v=null;try{v=localStorage.getItem(TUTO_KEY);}catch(e){}if(!v)tutoAbrir();}

cargar().then(tutoPrimeraVez);
setInterval(function(){if(!document.getElementById('ov')&&(TAB==='agenda'||TAB==='mis'))cargar();},60000);
</script>
