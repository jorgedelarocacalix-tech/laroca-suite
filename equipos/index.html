<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>La Roca — Análisis por Equipo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0D0D0D;color:#fff;min-height:100%}
body{padding:24px 16px 60px}
.wrap{max-width:1100px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:20px}
.brand h1{font-size:20px;font-weight:800}
.brand p{font-size:12px;color:#555;margin-top:2px}
.back{font-size:12px;color:#5B9CEA;text-decoration:none;border:1px solid #1E1E1E;padding:6px 12px;border-radius:8px}
.back:hover{background:#141414}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.mbtn{background:#141414;border:1px solid #1E1E1E;color:#aaa;font-size:12px;font-weight:700;padding:7px 14px;border-radius:8px;cursor:pointer}
.mbtn.on{background:#1E2A1E;border-color:#2E7D32;color:#8BC34A}
.mbtn:hover{border-color:#2A2A2A}
.status{font-size:12px;color:#555;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.team{background:#141414;border:1px solid #1E1E1E;border-radius:16px;padding:20px;position:relative;overflow:hidden}
.team::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.team h2{font-size:17px;font-weight:800;margin-bottom:2px}
.team .sub{font-size:11px;color:#555;margin-bottom:16px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stat{background:#0F0F0F;border:1px solid #1a1a1a;border-radius:10px;padding:12px}
.stat .l{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.stat .v{font-size:19px;font-weight:800}
.stat .s{font-size:10.5px;color:#666;margin-top:3px}
.good{color:#48bb78}.warn{color:#ed8936}.bad{color:#fc5c5c}.info{color:#5B9CEA}
.bar{height:6px;background:#1c1c1c;border-radius:3px;margin-top:8px;overflow:hidden}
.bar>div{height:100%;border-radius:3px}
.mini{margin-top:16px}
.mini h3{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.prodrow{display:flex;justify-content:space-between;font-size:11.5px;padding:5px 0;border-bottom:1px solid #1a1a1a;color:#bbb}
.prodrow:last-child{border-bottom:none}
.prodrow b{color:#eee;font-weight:600}
.empty-mini{font-size:11px;color:#555;padding:6px 0}
.loading{text-align:center;color:#555;font-size:13px;padding:60px 0}
.foot-note{font-size:10px;color:#3a3a3a;text-align:center;margin-top:30px;line-height:1.7}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>📈 Análisis por Equipo</h1>
      <p>Ventas · Cobro vs. Proyectado · Mora · Inventario · Recompra</p>
    </div>
    <a class="back" href="../">← Volver a la Suite</a>
  </div>

  <div class="controls" id="mesButtons"></div>
  <div class="status" id="statusLine">Cargando…</div>

  <div id="content" class="loading">Cargando datos de las 3 fuentes (Cobranza, Ventas, CRM)…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ══ Config ══
var SUPA1_URL='https://ixskgawbpwwxdjnkiixt.supabase.co'; // Cobranza + Analisis de Cierre
var SUPA1_KEY='sb_publishable_-JUaSYPPkq8n4wJIKPtXGw_XMyj3EE7';
var SUPA2_URL='https://upaenjotkocmdvfuobii.supabase.co'; // CRM
var SUPA2_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwYWVuam90a29jbWR2ZnVvYmlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NjQzMzUsImV4cCI6MjA5NDQ0MDMzNX0.am0lcEwz4-HK0KvrPBtv1QB7joNYDpOuQNhbc1HjwZ8';
var sbA=window.supabase.createClient(SUPA1_URL,SUPA1_KEY);
var sbC=window.supabase.createClient(SUPA2_URL,SUPA2_KEY);

var NOMBRES_CARTERA={LA_ROCA_COMERCIAL_1:'La Roca Comercial',LA_ROCA_MOTORS_BARRIO_ARRIBA_1:'Motors Barrio Arriba',LA_ROCA_MOTORS_LA_LIBERTAD_2:'Motors La Libertad',SU_MOTO_DANLI:'Su Moto Danlí',SU_MUEBLE:'Su Mueble'};

var EQUIPOS=[
  {id:'roca',nombre:'Equipo Roca',color:'#E07070',
    carterasCobranza:['LA_ROCA_COMERCIAL_1','LA_ROCA_MOTORS_BARRIO_ARRIBA_1','LA_ROCA_MOTORS_LA_LIBERTAD_2'],
    sucursalesVentas:['R1','R2','R3'],
    carterasCRM:['roca1','roca1motors','roca2motors']},
  {id:'sumueble',nombre:'Equipo Su Mueble',color:'#5B9CEA',
    carterasCobranza:['SU_MUEBLE','SU_MOTO_DANLI'],
    sucursalesVentas:['R4','R5'],
    carterasCRM:['sumuebledanli','sumotodanli']}
];

var hoy=new Date();
var MES_ACTUAL=hoy.getFullYear()+'-'+String(hoy.getMonth()+1).padStart(2,'0');
var mesSel=MES_ACTUAL;

function fmt(n){return 'L '+Math.round(n||0).toLocaleString('es-HN');}
function pct(a,b){return b>0?Math.round(a/b*100):0;}
function norm(s){return String(s||'').toLowerCase().trim().replace(/\s+/g,' ').replace(/[.,]/g,'');}
function mesLabel(mk){var M=['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];var p=mk.split('-');return M[parseInt(p[1])]+' '+p[0];}

function findCol(headersLower,keys){
  for(var i=0;i<headersLower.length;i++){var h=headersLower[i];for(var k=0;k<keys.length;k++){if(h===keys[k]||h.indexOf(keys[k])===0)return i;}}
  return -1;
}

// ══ Fetch: Cobranza (cierre_proyeccion + historial_clientes) ══
async function fetchCobranza(mesKey){
  var r1=await sbA.from('cierre_proyeccion').select('cartera_id,mes_key,datos').order('mes_key',{ascending:false});
  var byCart={}; // ultimo cierre por cartera
  (r1.data||[]).forEach(function(row){
    if(byCart[row.cartera_id])return;
    byCart[row.cartera_id]=row;
  });
  var start=mesKey+'-01';
  var partes=mesKey.split('-').map(Number);
  var endD=new Date(partes[0],partes[1],0);
  var end=partes[0]+'-'+String(partes[1]).padStart(2,'0')+'-'+String(endD.getDate()).padStart(2,'0');
  var r2=await sbA.from('historial_clientes').select('cartera_id,cliente_nombre,tipo,monto,fecha_accion')
    .in('tipo',['pago','abono']).gte('fecha_accion',start).lte('fecha_accion',end);
  var pagosPorCartera={}; // cartera_id -> {total, pagaron:Set(nombre normalizado)}
  (r2.data||[]).forEach(function(p){
    if(!pagosPorCartera[p.cartera_id])pagosPorCartera[p.cartera_id]={total:0,pagaron:new Set()};
    pagosPorCartera[p.cartera_id].total+=Number(p.monto||0);
    pagosPorCartera[p.cartera_id].pagaron.add(norm(p.cliente_nombre));
  });
  var out={};
  Object.keys(byCart).forEach(function(cid){
    var datos=byCart[cid].datos||[];
    var proyectado=0,moraTotal=0,clientesEnMora=[],nClientes=0;
    datos.forEach(function(c){
      if(c.mora==='INACTIVO')return;
      nClientes++;
      proyectado+=(c.montoAsesor||0);
      if((c.moraVal||0)>0){moraTotal+=c.moraVal;clientesEnMora.push(c);}
    });
    var pc=pagosPorCartera[cid]||{total:0,pagaron:new Set()};
    var sinAbonar=clientesEnMora.filter(function(c){return !pc.pagaron.has(norm(c.nombre));});
    out[cid]={proyectado:proyectado,cobrado:pc.total,moraTotal:moraTotal,nClientesEnMora:clientesEnMora.length,nSinAbonar:sinAbonar.length,nClientes:nClientes};
  });
  return out;
}

// ══ Fetch: Ventas (cierre_ventas) ══
async function fetchVentas(mesKey){
  var r=await sbA.from('cierre_ventas').select('sucursal,rows,headers').eq('mes_key',mesKey);
  var out={}; // sucursal -> {total, nVentas, productosVendidos:Set}
  (r.data||[]).forEach(function(row){
    var headers=(row.headers||[]).map(function(h){return norm(h);});
    var iMonto=findCol(headers,['total venta','monto','sub total','subtotal','total','valor','importe','ventas','venta']);
    var iProd=findCol(headers,['producto','articulo','descripcion','item','modelo']);
    var total=0,nVentas=0;var prods=new Set();
    (row.rows||[]).forEach(function(r0){
      if(!r0.some(function(c){return String(c||'').trim();}))return;
      nVentas++;
      if(iMonto>=0){var v=parseFloat(String(r0[iMonto]||'').replace(/[,L$\s]/g,''))||0;total+=v;}
      if(iProd>=0){var p=norm(r0[iProd]);if(p)prods.add(p);}
    });
    out[row.sucursal]={total:total,nVentas:nVentas,productos:prods};
  });
  return out;
}

// ══ Fetch: Inventario (cierre_inventario, siempre mes actual) — productos sin movimiento ══
async function fetchInventarioSinMovimiento(ventasPorSuc){
  var r=await sbA.from('cierre_inventario').select('sucursal,rows,headers');
  var out={}; // sucursal -> [{nombre,cantidad,valor}]
  (r.data||[]).forEach(function(row){
    var headers=(row.headers||[]).map(function(h){return norm(h);});
    var iDesc=findCol(headers,['descripcion']);
    var iCant=findCol(headers,['cantidad']);
    var iPV=findCol(headers,['precio venta']);
    if(iDesc<0)return;
    var vendidosSet=(ventasPorSuc[row.sucursal]&&ventasPorSuc[row.sucursal].productos)||new Set();
    var lista=[];
    (row.rows||[]).forEach(function(r0){
      var desc=String(r0[iDesc]||'').trim();if(!desc)return;
      var descN=norm(desc);
      var cant=iCant>=0?(parseFloat(String(r0[iCant]||'').replace(/[,\s]/g,''))||0):0;
      if(cant<=0)return; // sin stock, no aplica
      var yaVendido=false;
      vendidosSet.forEach(function(p){if(p===descN||p.indexOf(descN)>=0||descN.indexOf(p)>=0)yaVendido=true;});
      if(yaVendido)return;
      var pv=iPV>=0?(parseFloat(String(r0[iPV]||'').replace(/[,L$\s]/g,''))||0):0;
      lista.push({nombre:desc,cantidad:cant,valor:cant*pv});
    });
    lista.sort(function(a,b){return b.valor-a.valor;});
    out[row.sucursal]=lista;
  });
  return out;
}

// ══ Fetch: CRM — actividad de llamadas del mes + clientes recompra (Kanban "Vendido") ══
// Nota: gestiones.estado NUNCA vale 'vendido' (ese es solo el id de columna del Kanban,
// guardado en clientes.kb_col). Tampoco hay fecha confiable de cuándo un cliente pasó a
// vendido (updated_at es de una sincronización masiva, no del cambio de columna). Por eso
// medimos: (1) clientes actualmente marcados Vendido por cartera, (2) el total de llamadas
// reales y clientes únicos contactados en el mes (meta del CRM: 8 gestiones/día por
// vendedor), y (3) cuántas de esas llamadas fueron a clientes ya marcados Vendido.
async function fetchActividadCRM(mesKey){
  var rc=await sbC.from('clientes').select('id,cartera_id').eq('kb_col','vendido');
  var vendidoIds=new Set();var vendidoPorCartera={};
  (rc.data||[]).forEach(function(c){
    vendidoIds.add(c.id);
    vendidoPorCartera[c.cartera_id]=(vendidoPorCartera[c.cartera_id]||0)+1;
  });

  var start=mesKey+'-01';
  var partes=mesKey.split('-').map(Number);
  var endD=new Date(partes[0],partes[1],0);
  var end=partes[0]+'-'+String(partes[1]).padStart(2,'0')+'-'+String(endD.getDate()).padStart(2,'0');
  var rg=await sbC.from('gestiones').select('client_id,cartera_id,date_iso,estado,resultado')
    .gte('date_iso',start).lte('date_iso',end);

  var out={}; // cartera_id -> {clientesVendido, llamadasMes, llamadasTotalMes, clientesContactados}
  var contactadosPorCartera={}; // cartera_id -> Set(client_id)
  function ensure(cid){
    if(!out[cid])out[cid]={clientesVendido:vendidoPorCartera[cid]||0,llamadasMes:0,llamadasTotalMes:0,clientesContactados:0};
    return out[cid];
  }
  Object.keys(vendidoPorCartera).forEach(ensure);
  (rg.data||[]).forEach(function(g){
    var esReal=g.estado!=='actividad'&&g.estado!=='meta_manual'&&g.resultado!=='venta-manual';
    if(!esReal)return;
    var o=ensure(g.cartera_id);
    o.llamadasTotalMes++;
    if(vendidoIds.has(g.client_id))o.llamadasMes++;
    if(g.client_id){
      if(!contactadosPorCartera[g.cartera_id])contactadosPorCartera[g.cartera_id]=new Set();
      contactadosPorCartera[g.cartera_id].add(g.client_id);
    }
  });
  Object.keys(contactadosPorCartera).forEach(function(cid){
    ensure(cid).clientesContactados=contactadosPorCartera[cid].size;
  });
  return out;
}

// ══ Render ══
async function cargarTodo(){
  document.getElementById('statusLine').textContent='Cargando '+mesLabel(mesSel)+'…';
  document.getElementById('content').innerHTML='<div class="loading">Cargando datos de las 3 fuentes (Cobranza, Ventas, CRM)…</div>';
  try{
    var cobranza=await fetchCobranza(mesSel);
    var ventas=await fetchVentas(mesSel);
    var invSinMov= mesSel===MES_ACTUAL ? await fetchInventarioSinMovimiento(ventas) : {};
    var crm=await fetchActividadCRM(mesSel);
    renderEquipos(cobranza,ventas,invSinMov,crm);
    document.getElementById('statusLine').textContent='Datos de '+mesLabel(mesSel)+(mesSel!==MES_ACTUAL?' · Inventario solo disponible para el mes actual':'');
  }catch(err){
    document.getElementById('content').innerHTML='<div class="loading" style="color:#fc5c5c">Error cargando datos: '+err.message+'</div>';
  }
}

function renderEquipos(cobranza,ventas,invSinMov,crm){
  var html='<div class="grid2">';
  EQUIPOS.forEach(function(eq){
    var proyectado=0,cobrado=0,moraTotal=0,nSinAbonar=0,nEnMora=0;
    eq.carterasCobranza.forEach(function(cid){
      var c=cobranza[cid];if(!c)return;
      proyectado+=c.proyectado;cobrado+=c.cobrado;moraTotal+=c.moraTotal;nSinAbonar+=c.nSinAbonar;nEnMora+=c.nClientesEnMora;
    });
    var ventaTotal=0,nVentas=0;
    eq.sucursalesVentas.forEach(function(suc){
      var v=ventas[suc];if(!v)return;
      ventaTotal+=v.total;nVentas+=v.nVentas;
    });
    var prodSinMov=[];
    eq.sucursalesVentas.forEach(function(suc){
      (invSinMov[suc]||[]).forEach(function(p){prodSinMov.push(p);});
    });
    prodSinMov.sort(function(a,b){return b.valor-a.valor;});
    var valorSinMov=prodSinMov.reduce(function(s,p){return s+p.valor;},0);
    var clientesVendido=0,llamadasMes=0,llamadasTotalMes=0,clientesContactados=0;
    eq.carterasCRM.forEach(function(cid){
      var g=crm[cid];if(!g)return;
      clientesVendido+=g.clientesVendido;llamadasMes+=g.llamadasMes;
      llamadasTotalMes+=g.llamadasTotalMes;clientesContactados+=g.clientesContactados;
    });

    var pctCobro=pct(cobrado,proyectado);
    var cobroColor=pctCobro>=90?'good':pctCobro>=70?'warn':'bad';
    var cobroBarColor=pctCobro>=90?'#48bb78':pctCobro>=70?'#ed8936':'#fc5c5c';

    html+='<div class="team" style="--c:'+eq.color+'"><style>.team[style*="'+eq.color+'"]::before{background:'+eq.color+'}</style>';
    html+='<h2>'+eq.nombre+'</h2><div class="sub">'+eq.carterasCobranza.map(function(c){return NOMBRES_CARTERA[c]||c;}).join(' · ')+'</div>';

    html+='<div class="mrow">';
    html+='<div class="stat"><div class="l">Ventas generadas</div><div class="v info">'+fmt(ventaTotal)+'</div><div class="s">'+nVentas+' ventas registradas</div></div>';
    html+='<div class="stat"><div class="l">Cobro vs. proyectado</div><div class="v '+cobroColor+'">'+pctCobro+'%</div><div class="s">'+fmt(cobrado)+' de '+fmt(proyectado)+'</div><div class="bar"><div style="width:'+Math.min(pctCobro,100)+'%;background:'+cobroBarColor+'"></div></div></div>';
    html+='</div>';

    html+='<div class="mrow">';
    html+='<div class="stat"><div class="l">Clientes sin abonar</div><div class="v bad">'+nSinAbonar+'</div><div class="s">de '+nEnMora+' en mora · '+fmt(moraTotal)+' mora total</div></div>';
    html+='<div class="stat"><div class="l">Clientes recompra (Vendido)</div><div class="v good">'+clientesVendido+'</div><div class="s">'+llamadasMes+' llamadas a estos clientes en '+mesLabel(mesSel)+'</div></div>';
    html+='</div>';

    html+='<div class="mrow">';
    html+='<div class="stat"><div class="l">Llamadas totales (CRM)</div><div class="v info">'+llamadasTotalMes+'</div><div class="s">gestiones reales en '+mesLabel(mesSel)+' · meta 8/día por vendedor</div></div>';
    html+='<div class="stat"><div class="l">Clientes contactados</div><div class="v info">'+clientesContactados+'</div><div class="s">clientes únicos con al menos 1 llamada</div></div>';
    html+='</div>';

    html+='<div class="mini"><h3>📦 Productos con stock sin vender este mes ('+prodSinMov.length+''+(valorSinMov?' · '+fmt(valorSinMov)+' en riesgo':'')+')</h3>';
    if(!prodSinMov.length){
      html+='<div class="empty-mini">'+(Object.keys(invSinMov).length?'Todo el inventario con stock tuvo movimiento.':'Sube el inventario del mes en Análisis de Cierre para ver este dato.')+'</div>';
    } else {
      prodSinMov.slice(0,6).forEach(function(p){
        html+='<div class="prodrow"><b>'+p.nombre+'</b><span>'+p.cantidad+' und · '+fmt(p.valor)+'</span></div>';
      });
      if(prodSinMov.length>6)html+='<div class="empty-mini">+'+(prodSinMov.length-6)+' productos más sin vender</div>';
    }
    html+='</div>';

    html+='</div>';
  });
  html+='</div>';
  html+='<div class="foot-note">Cobro = pagos/abonos registrados en Cobranza el mes seleccionado · Proyectado = último cierre de mes cargado por gerencia<br>Clientes recompra = clientes del CRM actualmente en la columna "Vendido" del tablero Recompra · Llamadas = gestiones reales hechas a esos clientes en el mes seleccionado (excluye ventas manuales; el CRM no registra la fecha exacta en que un cliente pasó a Vendido)<br>Productos sin movimiento = inventario con stock que no aparece en las ventas del mes (solo disponible para el mes actual)</div>';
  document.getElementById('content').innerHTML=html;
}

// ══ Selector de mes ══
async function initMeses(){
  var r=await sbA.from('cierre_ventas').select('mes_key').order('mes_key',{ascending:false});
  var set=new Set([MES_ACTUAL]);
  (r.data||[]).forEach(function(row){set.add(row.mes_key);});
  var meses=[...set].sort().reverse().slice(0,6);
  var el=document.getElementById('mesButtons');
  el.innerHTML=meses.map(function(mk){
    return '<button class="mbtn'+(mk===mesSel?' on':'')+'" onclick="selMes(\''+mk+'\')">'+(mk===MES_ACTUAL?'🔴 ':'')+mesLabel(mk)+'</button>';
  }).join('');
}
function selMes(mk){
  mesSel=mk;
  document.querySelectorAll('.mbtn').forEach(function(b){b.classList.remove('on');});
  event.target.classList.add('on');
  cargarTodo();
}

initMeses().then(cargarTodo);
</script>
</body>
</html>
