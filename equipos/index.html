function findCol(headersLower,keys){
  for(var i=0;i<headersLower.length;i++){var h=headersLower[i];for(var k=0;k<keys.length;k++){if(h===keys[k]||h.indexOf(keys[k])===0)return i;}}
  return -1;
}
function parseHNDate(s){if(!s)return null;var p=String(s).split('/');if(p.length!==3)return null;var d=new Date(+p[2],+p[1]-1,+p[0]);d.setHours(0,0,0,0);return isNaN(d)?null:d;}

// ══ Fetch: Arqueos (cierres de caja diarios) — la fuente real de ventas y cobros ══
// cobrado = TODO lo que pasó por caja ese día (abonos + primas + contado), por eso no sirve
// solo para medir cobranza. Se desglosa analisis_json.cobros[].tipo: ABONO es cobranza real
// de cartera; PRIMA y CONTADO son dinero de ventas nuevas, no cobranza. Ventas = analisis_json.ventas[].total_erp.
async function fetchArqueos(mesKey){
  var start=mesKey+'-01';
  var partes=mesKey.split('-').map(Number);
  var endD=new Date(partes[0],partes[1],0);
  var end=partes[0]+'-'+String(partes[1]).padStart(2,'0')+'-'+String(endD.getDate()).padStart(2,'0');
  var r=await sbA.from('arqueos').select('sucursal,fecha,version,analisis_json')
    .gte('fecha',start).lte('fecha',end).order('version',{ascending:false});
  var vistos={}; // sucursal+fecha -> ya procesado (toma la version mas reciente, como dedupArqueos)
  var out={}; // sucursal -> {ventaTotal,nVentas,cobradoAbono,productosVendidos:Set,pagaronNombres:Set}
  function ensure(suc){
    if(!out[suc])out[suc]={ventaTotal:0,nVentas:0,cobradoAbono:0,productosVendidos:new Set(),pagaronNombres:new Set()};
    return out[suc];
  }
  (r.data||[]).forEach(function(row){
    var key=row.sucursal+'|'+row.fecha;
    if(vistos[key])return; // ya se tomó la version mas reciente de este dia
    vistos[key]=true;
    var o=ensure(row.sucursal);
    var aj=row.analisis_json||{};
    (aj.ventas||[]).forEach(function(v){
      o.ventaTotal+=Number(v.total_erp||0);
      o.nVentas++;
      if(v.articulo)o.productosVendidos.add(norm(v.articulo));
    });
    (aj.cobros||[]).forEach(function(c){
      if((c.tipo||'').toUpperCase()!=='ABONO')return;
      o.cobradoAbono+=Number(c.monto||0);
      if(c.cliente)o.pagaronNombres.add(norm(c.cliente));
    });
  });
  return out;
}

// ══ Fetch: Ventas por vendedor (cierre_ventas, Excel subido en Análisis de Cierre) ══
// Nota: distinto de arqueos — este es el detalle por asesor de ventas, no siempre está
// subido para el mes actual (depende de que cada tienda suba su Excel de vendedores).
async function fetchVentasPorVendedor(mesKey){
  var r=await sbA.from('cierre_ventas').select('sucursal,rows,headers').eq('mes_key',mesKey);
  var out={}; // sucursal -> [{vendedor,monto,cant,tickets}]
  (r.data||[]).forEach(function(row){
    var headers=(row.headers||[]).map(function(h){return norm(h);});
    var iVend=findCol(headers,['vendedor','asesor','agente','representante']);
    var iMonto=findCol(headers,['total venta','monto','sub total','subtotal','total','valor','importe','ventas','venta']);
    var iCant=findCol(headers,['cantidad','qty','cant','unidades']);
    if(iVend<0)return;
    var porVend={};
    (row.rows||[]).forEach(function(r0){
      var vend=String(r0[iVend]||'').trim();if(!vend)return;
      var key=vend.toLowerCase().replace(/[\s.\-_]/g,'');
      if(!porVend[key])porVend[key]={vendedor:vend,monto:0,cant:0,tickets:0};
      var v=iMonto>=0?(parseFloat(String(r0[iMonto]||'').replace(/[,L$\s]/g,''))||0):0;
      var c=iCant>=0?(parseFloat(String(r0[iCant]||'').replace(/[,\s]/g,''))||0):0;
      porVend[key].monto+=v;porVend[key].cant+=(c||1);porVend[key].tickets++;
    });
    out[row.sucursal]=Object.keys(porVend).map(function(k){return porVend[k];}).sort(function(a,b){return b.monto-a.monto;});
  });
  return out;
}

// ══ Fetch: Proyectado — "Mi Proyección" (proyeccion_manual, subida en Análisis de Cierre)
// con respaldo en cierre_proyeccion de Cobranza si una sucursal no tiene datos ahí ══
async function fetchProyectado(mesKey){
  var out={}; // sucursal -> monto proyectado
  var r1=await sbA.from('proyeccion_manual').select('filas').eq('mes_key',mesKey).maybeSingle();
  var sucsConManual={};
  ((r1.data&&r1.data.filas)||[]).forEach(function(f){
    var suc=f.sucursal;if(!suc)return;
    out[suc]=(out[suc]||0)+Number(f.monto||0);
    sucsConManual[suc]=true;
  });
  var faltantes=TIENDAS.filter(function(t){return !sucsConManual[t.ventas];});
  if(faltantes.length){
    var r2=await sbA.from('cierre_proyeccion').select('cartera_id,mes_key,datos').order('mes_key',{ascending:false});
    var byCart={};
    (r2.data||[]).forEach(function(row){if(!byCart[row.cartera_id])byCart[row.cartera_id]=row;});
    faltantes.forEach(function(t){
      var row=byCart[t.cobranza];if(!row)return;
      var total=0;
      (row.datos||[]).forEach(function(c){if(c.mora!=='INACTIVO')total+=(c.montoAsesor||0);});
      out[t.ventas]=total;
    });
  }
  return out;
}

// ══ Fetch: Mora en vivo de Cobranza (carteras) — misma fórmula que "Reporte de Cobro" ══
// diferencia = saldo real − saldo esperado según cuotas transcurridas. Siempre es "a hoy",
// no depende del mes seleccionado (Cobranza no guarda snapshots históricos por cliente).
function calcMoraCliente(c){
  var numCuotas=c.num_cuotas||0;
  var totalCredito=(c.pagado||0)+(c.saldo||0);
  if(!totalCredito||!c.cuota||c.cuota<=0)return null;
  var fFact=parseHNDate(c.fecha_factura);
  var cuotasTrans=0;
  var hoyD=new Date();
  if(fFact&&hoyD>fFact){
    var meses=(hoyD.getFullYear()-fFact.getFullYear())*12+(hoyD.getMonth()-fFact.getMonth());
    if(c.dia_pago>0&&hoyD.getDate()>=c.dia_pago)meses+=1;
    cuotasTrans=Math.max(0,Math.min(meses,numCuotas||999));
  }
  var esperado=Math.max(0,Math.round(totalCredito-cuotasTrans*c.cuota));
  return c.saldo-esperado;
}
async function fetchMoraCobranza(){
  var ids=TIENDAS.map(function(t){return t.cobranza;});
  var r=await sbA.from('carteras').select('id,clientes').in('id',ids);
  var out={}; // cartera_id -> {clientesEnMora:[{nombre,moraVal}], moraTotal}
  (r.data||[]).forEach(function(row){
    var lista=[],total=0;
    (row.clientes||[]).forEach(function(c){
      if(c.tramo==='INACTIVO')return;
      var dif=calcMoraCliente(c);
      if(dif&&dif>0){lista.push({nombre:c.nombre,moraVal:dif,cuota:c.cuota||0,saldo:c.saldo||0,ultimoPago:c.ultimo_pago||''});total+=dif;}
    });
    out[row.id]={clientesEnMora:lista,moraTotal:total};
  });
  return out;
}

// ══ Fetch: Inventario (cierre_inventario, siempre mes actual) — productos sin movimiento ══
// También detecta inventarios "copiados": si dos sucursales tienen exactamente el mismo
// archivo cargado (mismo total de filas + misma primera fila), lo más probable es que
// alguien subió el Excel equivocado — se marca para avisar en pantalla, no se adivina cuál
// de las dos es la correcta.
async function fetchInventarioSinMovimiento(arqPorSuc){
  var r=await sbA.from('cierre_inventario').select('sucursal,rows,headers');
  var out={}; // sucursal -> [{nombre,cantidad,valor}]
  var firmas={}; // firma (primera fila + n filas) -> [sucursales]
  var dupMap={}; // sucursal -> [otras sucursales con el mismo archivo]
  (r.data||[]).forEach(function(row){
    var headers=(row.headers||[]).map(function(h){return norm(h);});
    var iDesc=findCol(headers,['descripcion']);
    var iCant=findCol(headers,['cantidad']);
    var iPV=findCol(headers,['precio venta']);
    if(iDesc<0)return;

    var firma=(row.rows&&row.rows.length)+'|'+JSON.stringify(row.rows&&row.rows[0]);
    if(!firmas[firma])firmas[firma]=[];
    firmas[firma].push(row.sucursal);

    var vendidosSet=(arqPorSuc[row.sucursal]&&arqPorSuc[row.sucursal].productosVendidos)||new Set();
    var lista=[];
    (row.rows||[]).forEach(function(r0){
      var desc=String(r0[iDesc]||'').trim();if(!desc)return;
      var descN=norm(desc);
      var cant=iCant>=0?(parseFloat(String(r0[iCant]||'').replace(/[,\s]/g,''))||0):0;
      if(cant<=0)return; // sin stock, no aplica
      var yaVendido=false;
      vendidosSet.forEach(function(p){if(p===descN||p.indexOf(descN)>=0||descN.indexOf(p)>=0)yaVendido=true;});
      if(yaVendido)return;
      var pv=iPV>=0?(parseFloat(String(r0[iPV]||'').replace(/[,L$\s]/g,''))||0):0;
      lista.push({nombre:desc,cantidad:cant,valor:cant*pv});
    });
    lista.sort(function(a,b){return b.valor-a.valor;});
    out[row.sucursal]=lista;
  });
  Object.keys(firmas).forEach(function(f){
    var sucs=firmas[f];
    if(sucs.length<2)return;
    sucs.forEach(function(s){dupMap[s]=sucs.filter(function(x){return x!==s;});});
  });
  out._duplicados=dupMap;
  return out;
}

// ══ Fetch: CRM — actividad de llamadas del mes + clientes recompra (Kanban "Vendido") ══
// Nota: gestiones.estado NUNCA vale 'vendido' (ese es solo el id de columna del Kanban,
// guardado en clientes.kb_col). Tampoco hay fecha confiable de cuándo un cliente pasó a
// vendido (updated_at es de una sincronización masiva, no del cambio de columna). Por eso
// medimos: (1) clientes actualmente marcados Vendido por cartera, (2) el total de llamadas
// reales y clientes únicos contactados en el mes (meta del CRM: 8 gestiones/día por
// vendedor), y (3) cuántas de esas llamadas fueron a clientes ya marcados Vendido.
async function fetchActividadCRM(mesKey){
  var rc=await sbC.from('clientes').select('id,cartera_id').eq('kb_col','vendido');
  var vendidoIds=new Set();var vendidoPorCartera={};
  (rc.data||[]).forEach(function(c){
    vendidoIds.add(c.id);
    vendidoPorCartera[c.cartera_id]=(vendidoPorCartera[c.cartera_id]||0)+1;
  });

  var start=mesKey+'-01';
  var partes=mesKey.split('-').map(Number);
  var endD=new Date(partes[0],partes[1],0);
  var end=partes[0]+'-'+String(partes[1]).padStart(2,'0')+'-'+String(endD.getDate()).padStart(2,'0');
  var rg=await sbC.from('gestiones').select('client_id,cartera_id,date_iso,estado,resultado,user_name')
    .gte('date_iso',start).lte('date_iso',end);

  var out={}; // cartera_id -> {clientesVendido, llamadasMes, llamadasTotalMes, clientesContactados, porVendedor}
  var contactadosPorCartera={}; // cartera_id -> Set(client_id)
  function ensure(cid){
    if(!out[cid])out[cid]={clientesVendido:vendidoPorCartera[cid]||0,llamadasMes:0,llamadasTotalMes:0,clientesContactados:0,porVendedor:{}};
    return out[cid];
  }
  Object.keys(vendidoPorCartera).forEach(ensure);
  (rg.data||[]).forEach(function(g){
    var esReal=g.estado!=='actividad'&&g.estado!=='meta_manual'&&g.resultado!=='venta-manual';
    if(!esReal)return;
    var o=ensure(g.cartera_id);
    o.llamadasTotalMes++;
    if(vendidoIds.has(g.client_id))o.llamadasMes++;
    var vend=(g.user_name||'Sin nombre').trim();
    o.porVendedor[vend]=(o.porVendedor[vend]||0)+1;
    if(g.client_id){
      if(!contactadosPorCartera[g.cartera_id])contactadosPorCartera[g.cartera_id]=new Set();
      contactadosPorCartera[g.cartera_id].add(g.client_id);
    }
  });
  Object.keys(contactadosPorCartera).forEach(function(cid){
    ensure(cid).clientesContactados=contactadosPorCartera[cid].size;
  });
  return out;
}

// ══ Render ══
var ANALISIS_CIERRE_URL='https://analisis-cierre-production.up.railway.app';
var COBRANZA_URL='https://cobranza-app-production-f653.up.railway.app';

async function cargarTodo(){
  document.getElementById('statusLine').textContent='Cargando '+mesLabel(mesSel)+'…';
  document.getElementById('content').innerHTML='<div class="loading">Cargando datos de Arqueos, Cobranza y CRM…</div>';
  try{
    var arq=await fetchArqueos(mesSel);
    var proyectado=await fetchProyectado(mesSel);
    var mora=await fetchMoraCobranza();
    var invSinMov= mesSel===MES_ACTUAL ? await fetchInventarioSinMovimiento(arq) : {};
    var crm=await fetchActividadCRM(mesSel);
    var ventasVend=await fetchVentasPorVendedor(mesSel);
    renderEquipos(arq,proyectado,mora,invSinMov,crm,ventasVend);
    document.getElementById('statusLine').textContent='Datos de '+mesLabel(mesSel)+(mesSel!==MES_ACTUAL?' · Inventario y mora siempre reflejan hoy, no el mes histórico':' · Mora en vivo, a la fecha de hoy');
  }catch(err){
    document.getElementById('content').innerHTML='<div class="loading" style="color:#fc5c5c">Error cargando datos: '+err.message+'</div>';
  }
}

function renderEquipos(arq,proyectado,mora,invSinMov,crm,ventasVend){
  MORA_DATA={};MORA_OPEN={};
  DETAIL_DATA={};DETAIL_OPEN={};
  var html='<div class="grid2">';
  TIENDAS.forEach(function(t){
    var a=arq[t.ventas]||{ventaTotal:0,nVentas:0,cobradoAbono:0,productosVendidos:new Set(),pagaronNombres:new Set()};
    var proy=proyectado[t.ventas]||0;
    var m=mora[t.cobranza]||{clientesEnMora:[],moraTotal:0};
    var sinAbonar=m.clientesEnMora.filter(function(c){return !a.pagaronNombres.has(norm(c.nombre));});
    var cuotasSinAbonar=sinAbonar.reduce(function(s,c){return s+(c.cuota||0);},0);
    var saldoEnMora=m.clientesEnMora.reduce(function(s,c){return s+(c.saldo||0);},0);
    var cuotasEnMora=m.clientesEnMora.reduce(function(s,c){return s+(c.cuota||0);},0);
    var prodSinMov=(invSinMov[t.ventas]||[]).slice().sort(function(a2,b2){return b2.valor-a2.valor;});
    var valorSinMov=prodSinMov.reduce(function(s,p){return s+p.valor;},0);
    var g=crm[t.crm]||{clientesVendido:0,llamadasMes:0,llamadasTotalMes:0,clientesContactados:0};
    var dupSucs=((invSinMov._duplicados||{})[t.ventas]||[]).map(nombreSucursal);

    var pctCobro=pct(a.cobradoAbono,proy);
    var cobroColor=pctCobro>=90?'good':pctCobro>=70?'warn':'bad';
    var cobroBarColor=pctCobro>=90?'#48bb78':pctCobro>=70?'#ed8936':'#fc5c5c';
    var ventasHref=ANALISIS_CIERRE_URL+'/?tab=ventas&suc='+t.ventas+'&mes='+mesSel;
    var reporteHref=COBRANZA_URL+'/?cart='+t.cobranza+'&tab=REPORTE';

    html+='<div class="team" style="--c:'+t.color+'"><style>.team[style*="'+t.color+'"]::before{background:'+t.color+'}</style>';
    html+='<h2>'+t.nombre+'</h2><div class="sub">Cartera '+(NOMBRES_CARTERA[t.cobranza]||t.cobranza)+' · Ventas '+t.ventas+'</div>';

    if(dupSucs.length){
      html+='<div class="warn-box">⚠️ Inventario mal ingresado: es idéntico al de '+dupSucs.join(' y ')+'. Favor resubir el archivo correcto de esta tienda en Análisis de Cierre.</div>';
    }

    html+='<div class="mrow">';
    html+='<a class="stat statlink" href="'+ventasHref+'" target="_blank" rel="noopener"><div class="l">Ventas generadas ↗</div><div class="v info">'+fmt(a.ventaTotal)+'</div><div class="s">'+a.nVentas+' ventas (Arqueos) · ver detalle por vendedor</div></a>';
    html+='<div class="stat"><div class="l">Cobro vs. proyectado (sistema)</div><div class="v '+cobroColor+'">'+pctCobro+'%</div><div class="s">'+fmt(a.cobradoAbono)+' de '+fmt(proy)+' · solo abonos, sin primas/contado</div><div class="bar"><div style="width:'+Math.min(pctCobro,100)+'%;background:'+cobroBarColor+'"></div></div></div>';
    html+='</div>';

    html+='<div class="mrow">';
    html+='<button type="button" class="statbtn" onclick="toggleMoraList(\''+t.id+'\',\'todos\')"><div class="l">Mora (cartera)</div><div class="v bad">'+fmt(m.moraTotal)+'</div><div class="s">'+m.clientesEnMora.length+' clientes en mora · saldo '+fmt(saldoEnMora)+' · cuotas '+fmt(cuotasEnMora)+' · ver listado ▾</div></button>';
    html+='<div class="stat"><div class="l">Clientes que sí abonaron</div><div class="v good">'+a.pagaronNombres.size+'</div><div class="s">clientes distintos con abono en '+mesLabel(mesSel)+' (Arqueos)</div></div>';
    html+='</div>';

    html+='<div class="mrow">';
    html+='<button type="button" class="statbtn" onclick="toggleMoraList(\''+t.id+'\',\'sin\')"><div class="l">Clientes sin abonar</div><div class="v bad">'+sinAbonar.length+'</div><div class="s">de '+m.clientesEnMora.length+' en mora hoy · '+fmt(cuotasSinAbonar)+' en cuotas de este mes · ver listado ▾</div></button>';
    html+='<div class="stat"><div class="l">Clientes recompra (Vendido)</div><div class="v good">'+g.clientesVendido+'</div><div class="s">'+g.llamadasMes+' llamadas a estos clientes en '+mesLabel(mesSel)+'</div></div>';
    html+='</div>';

    html+='<div class="moralist" id="moralist-'+t.id+'">'
      +'<div class="moralist-wrap"><div class="moralist-scroll"><table><thead><tr><th>Cliente</th><th>Saldo</th><th>Cuota</th><th>Mora</th><th>Último pago</th><th>Estado ('+mesLabel(mesSel)+')</th></tr></thead><tbody id="moralist-body-'+t.id+'"></tbody></table></div></div>'
      +'<div class="moralist-foot">Mostrando <span id="moralist-count-'+t.id+'">0</span> clientes · <a href="'+reporteHref+'" target="_blank" rel="noopener">Abrir en Cobranza para gestionar →</a></div>'
      +'</div>';

    html+='<div class="mrow">';
    html+='<div class="stat"><div class="l">Llamadas totales (CRM)</div><div class="v info">'+g.llamadasTotalMes+'</div><div class="s">'+g.clientesContactados+' clientes contactados · meta 8/día por vendedor</div></div>';
    html+='<div class="stat" style="opacity:0"></div>';
    html+='</div>';

    var vv=(ventasVend[t.ventas]||[]);
    var vvKey='ventasvend-'+t.id;
    html+='<div class="mrow">';
    html+='<button type="button" class="statbtn" onclick="toggleDetailList(\''+vvKey+'\')"><div class="l">Ventas por vendedor</div><div class="v info">'+vv.length+' vendedor(es)</div><div class="s">monto y cantidad vendida en '+mesLabel(mesSel)+' · ver detalle ▾</div></button>';
    var lvKey='llamadasvend-'+t.id;
    html+='<button type="button" class="statbtn" onclick="toggleDetailList(\''+lvKey+'\')"><div class="l">Llamadas CRM por vendedor</div><div class="v info">'+Object.keys(g.porVendedor||{}).length+' vendedor(es)</div><div class="s">gestiones reales en '+mesLabel(mesSel)+' · ver detalle ▾</div></button>';
    html+='</div>';

    html+='<div class="moralist" id="detail-'+vvKey+'"><div class="moralist-wrap"><div class="moralist-scroll"><table><thead><tr><th>Vendedor</th><th>Monto vendido</th><th>Cantidad</th><th>Tickets</th></tr></thead><tbody id="detail-body-'+vvKey+'"></tbody></table></div></div></div>';
    html+='<div class="moralist" id="detail-'+lvKey+'"><div class="moralist-wrap"><div class="moralist-scroll"><table><thead><tr><th>Vendedor</th><th>Llamadas</th></tr></thead><tbody id="detail-body-'+lvKey+'"></tbody></table></div></div></div>';

    DETAIL_DATA[vvKey]={rows:vv.map(function(v){return [v.vendedor,fmt(v.monto),v.cant,v.tickets];})};
    var llamVendRows=Object.keys(g.porVendedor||{}).sort(function(x,y){return g.porVendedor[y]-g.porVendedor[x];}).map(function(v){return [v,g.porVendedor[v]];});
    DETAIL_DATA[lvKey]={rows:llamVendRows};

    MORA_DATA[t.id]=m.clientesEnMora.map(function(c){
      return {nombre:c.nombre,saldo:c.saldo,cuota:c.cuota,mora:c.moraVal,ultimoPago:c.ultimoPago,abono:a.pagaronNombres.has(norm(c.nombre))};
    }).sort(function(x,y){return y.mora-x.mora;});

    html+='<div class="mini"><h3>📦 Productos con stock sin vender este mes ('+prodSinMov.length+''+(valorSinMov?' · '+fmt(valorSinMov)+' en riesgo':'')+')</h3>';
    if(!prodSinMov.length){
      html+='<div class="empty-mini">'+(invSinMov[t.ventas]?'Todo el inventario con stock tuvo movimiento.':'Sube el inventario del mes en Análisis de Cierre para ver este dato.')+'</div>';
    } else {
      prodSinMov.slice(0,6).forEach(function(p){
        html+='<div class="prodrow"><b>'+p.nombre+'</b><span>'+p.cantidad+' und · '+fmt(p.valor)+'</span></div>';
      });
      if(prodSinMov.length>6)html+='<div class="empty-mini">+'+(prodSinMov.length-6)+' productos más sin vender</div>';
    }
    html+='</div>';

    html+='</div>';
  });
  html+='</div>';
  html+='<div class="foot-note">Ventas y Cobro = arqueos (cierres de caja diarios) del mes seleccionado · Cobro cuenta solo abonos, excluye primas y ventas de contado · Proyectado = "Mi Proyección" subida en Análisis de Cierre, o el cierre de Cobranza si falta<br>Clientes que sí abonaron = clientes distintos con abono registrado en arqueos ese mes · Clientes sin abonar = de los que Cobranza marca en mora HOY, cuáles no tienen abono ese mes en arqueos · "en cuotas de este mes" = suma de la cuota mensual de esos clientes (no la mora acumulada)<br>Cobro vs. Proyectado puede pasar de 100% aunque haya clientes sin abonar: son dos cosas distintas — uno mide dinero total (L), el otro cuenta personas. Pocos clientes pagando de más o liquidando saldo pueden superar la meta en L aunque otros no hayan pagado nada. En meses pasados, "en mora hoy" no es exactamente la misma mora que había ese mes, porque Cobranza no guarda fotos históricas por cliente<br>Clientes recompra = clientes del CRM actualmente en la columna "Vendido" del tablero Recompra · Llamadas = gestiones reales del mes (excluye ventas manuales; el CRM no registra la fecha exacta en que un cliente pasó a Vendido)<br>Productos sin movimiento = inventario con stock que no aparece en las ventas del mes (solo disponible para el mes actual)</div>';
  document.getElementById('content').innerHTML=html;
}

// ══ Selector de mes ══
async function initMeses(){
  var r=await sbA.from('arqueos').select('fecha').order('fecha',{ascending:false}).limit(2000);
  var set=new Set([MES_ACTUAL]);
  (r.data||[]).forEach(function(row){set.add(row.fecha.slice(0,7));});
  var meses=[...set].sort().reverse().slice(0,6);
  var el=document.getElementById('mesButtons');
  el.innerHTML=meses.map(function(mk){
    return '<button class="mbtn'+(mk===mesSel?' on':'')+'" onclick="selMes(\''+mk+'\')">'+(mk===MES_ACTUAL?'🔴 ':'')+mesLabel(mk)+'</button>';
  }).join('');
}
function selMes(mk){
  mesSel=mk;
  document.querySelectorAll('.mbtn').forEach(function(b){b.classList.remove('on');});
  event.target.classList.add('on');
  cargarTodo();
}

initMeses().then(cargarTodo);
</script>
