server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # HTML directo: siempre revalidar con el servidor
  location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }

  # Raíces de las apps (/ , /crm/ , /rrhh/ ...) sirven index.html: siempre fresco
  location = / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files /index.html =404;
  }
  location ~* /$ {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri/index.html $uri =404;
  }

  # Assets: caché corta (5 min) para que los cambios se propaguen rápido
  location ~* \.(js|css|json|txt|webmanifest)$ {
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "public, max-age=300";
    try_files $uri $uri/ =404;
    autoindex off;
  }
}
